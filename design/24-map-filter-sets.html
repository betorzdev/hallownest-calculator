<title>Map filter sets</title>
<!-- Design material, not part of the site. The Map's filter (js/app-map.js GROUPS, filterHtml): some
   layers are sets (1 Oct 2026, Albert: tidy and nice, but you can't tell what you're switching on,
   or which to switch to see one thing). The sets, read from js/app-map.js:
     Equipment, spells and arts ~19 (7 equipment, 6 spells, 3 arts, 3 Dream Nail steps) ·
     Bosses and trials 20 (15 bosses, 3 Colosseum trials, Grimm, Nightmare King) ·
     Key items 9 · Relics 4 kinds · Other bosses (dream, room, Hollow Knight, Radiance) ·
     Meetings with characters 8 people (31 meetings) · Shops and characters 11 ·
     Walls and floors 3 kinds · Markers 4 colours. The rest are one thing each.
   Over the site's real filter markup (save 4) and CSS:
     Now · as it is.
     A · What's inside: a set says it's a set (a caret by its name) and, tapped there, lists what
         it holds, with pictures; the switch stays the whole set's.
     B · Sub-filters: the caret opens the set into its members as small switches of their own; the
         set's switch turns all on or off, and says "some" when they differ.
     C · Split what mixes kinds + A: the sets of different things become one layer each
         (Equipment · Spells · Nail arts · Dream Nail; Bosses · Colosseum trials · Grimm Troupe),
         and the sets of one kind (key items, relics, people…) keep A's "what's inside".
   Chosen on 1 Oct 2026: C (built: js/app-map.js GROUPS, INSIDE, insideHtml; css/app.css; js/i18n.js;
   docs/guide.md). The same day, the groups' "All / None" went: the group's title is its switch,
   its caret alone folds it. And Albert asked for B's sub-filters in the sets of one kind: the
   caret's list became switches (prefs.pgMapSubOff).
   ?v=now|a|b|c. -->

<style>
body { background: var(--page-bg); background-attachment: fixed; margin: 0; }
.mk { max-width: 1100px; margin: 0 auto; padding: var(--sp-6) var(--page-pad) var(--sp-16); }
.mk-h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); margin: 0 0 var(--sp-2); }
.mk-lead { max-width: var(--measure); color: var(--ink-2); font-size: var(--fs-sm); margin: 0 0 var(--sp-4); }
.mk-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); padding: var(--sp-2) 0; margin-bottom: var(--sp-6); background: var(--scene-bg); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--muted); }
.mk-bar b { font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--label); font-weight: 600; }
.mk-bar button { background: none; border: 0; padding: var(--sp-1) 0; font: inherit; color: var(--muted); cursor: pointer; }
.mk-bar button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent-line); }
.mk-note { max-width: var(--measure); margin: 0 auto var(--sp-6); color: var(--ink-2); font-size: var(--fs-sm); text-align: center; min-height: 3em; }

/* ════ What would go into the site ════ */
.fs-set { display: inline-flex; align-items: center; gap: var(--sp-1); }
.fs-more { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 1px solid var(--line-ctl); border-radius: 50%; background: none; color: var(--ink-2); cursor: pointer; padding: 0; }
.fs-more svg { width: 9px; height: 9px; transition: transform var(--dur) var(--ease); }
.fs-more[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.fs-more[aria-expanded="true"] svg { transform: rotate(90deg); }
/* A: what's inside, listed under the set's row. */
.fs-pop { flex-basis: 100%; margin: var(--sp-1) 0 var(--sp-2) var(--sp-8); padding: var(--sp-2) var(--sp-4); border-left: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); font-size: var(--fs-xs); color: var(--ink-2); }
.fs-pop span { display: inline-flex; align-items: center; gap: var(--sp-1); }
.fs-pop img { width: 20px; height: 20px; object-fit: contain; }
/* B: the members as small switches. */
.fs-subs { flex-basis: 100%; margin: var(--sp-1) 0 var(--sp-2) var(--sp-8); padding-left: var(--sp-4); border-left: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); }
.fs-sub { display: inline-flex; align-items: center; gap: var(--sp-1); background: none; border: 0; padding: 0; min-height: var(--ctl-sm); font: inherit; font-size: var(--fs-xs); color: var(--ink); cursor: pointer; }
.fs-sub img { width: 20px; height: 20px; object-fit: contain; }
.fs-sub:not(.is-on) { color: var(--muted); }
.fs-sub:not(.is-on) img { filter: var(--missing-art); }
.pgm-kind.is-some .pgm-kind-art > * { filter: grayscale(0.5) brightness(0.75); }
.pgm-kind.is-some .pgm-kind-t::after { content: ' · algunos'; color: var(--muted); }
.pgm-kinds { flex-wrap: wrap; }
</style>
</head>

            <svg class="pgm-caret" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1 L8 5 L3 9 Z" fill="currentColor"></path></svg><span class="pgm-sec-t">Tu partida</span></button>
          <button type="button" class="text-btn" data-act="pgmGroup" data-value="mine">Ninguno</button>
        </div>
        <div class="pgm-kinds" role="group" aria-label="Tu partida"><button type="button" class="pgm-kind is-on" data-act="pgmLayer" data-value="my-bench" aria-pressed="true">
        <span class="pgm-kind-art"><svg class="pgm-atlas pgm-ico" viewBox="0 220 75 75" aria-hidden="true"><image href="assets/map/pins.png" width="512" height="449"></image></svg></span><span class="pgm-kind-t" translate="no">Tu banco</span></button><button type="button" class="pgm-kind is-on" data-act="pgmLayer" data-value="shade" aria-pressed="true">
        <span class="pgm-kind-art"><svg class="pgm-atlas pgm-ico" viewBox="0 122 90 96" aria-hidden="true"><image href="assets/map/pins.png" width="512" height="449"></image></svg></span><span class="pgm-kind-t" translate="no">Tu sombra</span></button><button type="button" class="pgm-kind is-on" data-act="pgmLayer" data-value="gate" aria-pressed="true">
        <span class="pgm-kind-art"><svg class="pgm-atlas pgm-ico" viewBox="428 122 79 79" aria-hidden="true"><image href="assets/map/pins.png" width="512" height="449"></image></svg></span><span class="pgm-kind-t" translate="no">Portal Onírico</span></button><button type="button" class="pgm-kind is-on" data-act="pgmLayer" data-value="markers" aria-pressed="true">
        <span class="pgm-kind-art"><svg class="pgm-atlas pgm-ico" viewBox="260 122 82 83" aria-hidden="true"><image href="assets/map/pins.png" width="512" height="449"></image></svg></span><span class="pgm-kind-t" translate="no">Marcadores</span></button></div>
      </section></div></template>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const st = { v: q.get('v') || 'c', open: new Set(), off: new Set() };
const V = {
  now: ['Now', 'As it is: one switch per set, and nothing says what a set holds.'],
  a: ['A · What\'s inside', 'A set carries a caret: tapped, it lists what it holds, with pictures. The switch stays the whole set\'s.'],
  b: ['B · Sub-filters', 'The caret opens the set into its members, each its own switch; the set\'s switch turns all on or off, and says "some" when they differ.'],
  c: ['C · Split + what\'s inside', 'The sets of different kinds become one layer each (Equipment · Spells · Nail arts · Dream Nail; Bosses · Colosseum trials · Grimm Troupe); the sets of one kind keep A\'s list.'],
};
const a = (p) => 'assets/' + p + '.png';
const SETS = {
  equip: [['Capa de polilla', a('abilities/cloak1')], ['Garra de mantis', a('items/mantis-claw')], ['Corazón de cristal', a('items/crystal-heart')], ['Alas de monarca', a('items/monarch-wings')], ['Lágrima de Isma', a('items/isma-tear')], ['Capa sombría', a('abilities/cloak2')], ['Marca del rey', a('items/kings-brand')], ['Espíritu vengativo', a('spells/vs')], ['Alma sombría', a('spells/vs2')], ['Salto desolador', a('spells/dd')], ['Oscuridad descendente', a('spells/dd2')], ['Espectros aulladores', a('spells/hw')], ['Chillido del Abismo', a('spells/hw2')], ['Corte ciclón', a('arts/cyclone')], ['Gran corte', a('arts/great')], ['Corte veloz', a('arts/dash')], ['Aguijón Onírico', a('abilities/dream1')], ['Aguijón Onírico despierto', a('abilities/awoken')], ['Ascensión', a('items/essence')]],
  bosses: [['15 jefes', a('journal/false-knight')], ['3 pruebas del Coliseo', ''], ['Grimm', a('journal/grimm')], ['Rey Pesadilla Grimm', a('journal/nkg')]],
  keys: [['Linterna de lumélula', a('items/lumafly-lantern')], ['Emblema de la ciudad', a('items/city-crest')], ['Llave del comerciante', a('items/shopkeepers-key')], ['Llave elegante', a('items/elegant-key')], ['Llave del amor', a('items/love-key')], ['Pase para el tranvía', a('items/tram-pass')], ['Afinador de Dioses', a('items/godtuner')], ['Mapa del coleccionista', a('items/collectors-map')], ['Diario del Cazador', a('items/hunters-journal')]],
  relics: [['Diario del errante', a('items/wanderers-journal')], ['Sello de Hallownest', a('items/hallownest-seal')], ['Ídolo del rey', a('items/kings-idol')], ['Huevo arcano', a('items/arcane-egg')]],
  'other-bosses': [['Jefes de sueño (5)', a('journal/grey-prince-zote')], ['Jefes de sala', a('journal/vengefly-king')], ['Caballero Hueco', a('journal/hollow-knight')], ['Radiancia', a('journal/the-radiance')]],
  npcs: [['Quirrel', ''], ['Sly', ''], ['Bretta', ''], ['Zote', ''], ['Cloth', ''], ['Tiso', ''], ['Hornet', ''], ['Forjaguijones', '']],
  people: [['Sly', ''], ['Iselda', ''], ['Salubra', ''], ['Comepiernas', ''], ['Lemm', ''], ['Jiji', ''], ['Herrero', ''], ['Vidente', ''], ['Padre Larva', ''], ['Coliseo de los Insensatos', ''], ['Templo del Huevo Negro', '']],
  walls: [['Muros', ''], ['Suelos', ''], ['Paredes de un solo sentido', '']],
  markers: [['Rojos', ''], ['Azules', ''], ['Amarillos', ''], ['Blancos', '']],
};
// C: the sets of different kinds, split into layers of their own (name, picture).
const SPLIT = {
  equip: [['Equipo', a('items/mantis-claw')], ['Hechizos', a('spells/vs')], ['Artes del aguijón', a('arts/cyclone')], ['Aguijón Onírico', a('abilities/dream1')]],
  bosses: [['Jefes', a('journal/false-knight')], ['Pruebas del Coliseo', ''], ['Compañía de Grimm', a('journal/grimm')]],
};
const CARET = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1 L8 5 L3 9 Z" fill="currentColor"/></svg>';
const item = ([n, p]) => `<span>${p ? `<img src="${p}" alt="">` : ''}${n}</span>`;
function paint() {
  document.getElementById('bar').innerHTML = '<b>Variant</b>' + Object.entries(V).map(([v, [n]]) => `<button type="button" data-v="${v}" aria-pressed="${st.v === v}">${n}</button>`).join('');
  document.getElementById('note').textContent = V[st.v][1];
  const stage = document.getElementById('stage');
  stage.innerHTML = document.getElementById('filter').innerHTML;
  if (st.v === 'now') return;
  stage.querySelectorAll('.pgm-kind').forEach((chip) => {
    const id = chip.dataset.value;
    if (st.v === 'c' && SPLIT[id]) {
      chip.outerHTML = SPLIT[id].map(([n, p]) => `<button type="button" class="pgm-kind is-on"><span class="pgm-kind-art">${p ? `<img src="${p}" alt="">` : '<i class="pgm-ico is-name">·</i>'}</span><span class="pgm-kind-t">${n}</span></button>`).join('');
      return;
    }
    const list = SETS[id];
    if (!list) return;
    const open = st.open.has(id);
    const wrap = document.createElement('span');
    wrap.className = 'fs-set';
    chip.replaceWith(wrap);
    wrap.appendChild(chip);
    wrap.insertAdjacentHTML('beforeend', `<button type="button" class="fs-more" data-open="${id}" aria-expanded="${open}" title="${st.v === 'b' ? 'Elegir cuáles' : 'Qué incluye'}">${CARET}</button>`);
    if (st.v === 'b') {
      const offs = list.filter((m) => st.off.has(id + '|' + m[0])).length;
      if (offs && offs < list.length) chip.classList.add('is-some');
    }
    if (!open) return;
    const body = st.v === 'b'
      ? `<div class="fs-subs">${list.map((m) => `<button type="button" class="fs-sub${st.off.has(id + '|' + m[0]) ? '' : ' is-on'}" data-sub="${id}|${m[0]}">${m[1] ? `<img src="${m[1]}" alt="">` : ''}${m[0]}</button>`).join('')}</div>`
      : `<div class="fs-pop">${list.map(item).join('')}</div>`;
    wrap.parentElement.insertAdjacentHTML('beforeend', body);
  });
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.v) st.v = b.dataset.v;
  else if (b.dataset.open) st.open.has(b.dataset.open) ? st.open.delete(b.dataset.open) : st.open.add(b.dataset.open);
  else if (b.dataset.sub) st.off.has(b.dataset.sub) ? st.off.delete(b.dataset.sub) : st.off.add(b.dataset.sub);
  else return;
  paint();
});
paint();
</script>
</body>
</html>

<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">

<title>Map filter variants</title>
<!-- Design material, not part of the site: the Map's filter (under the map), three looks to choose
     from (30 Sep 2026). The site's real CSS and frame; the filter's real sections, layers, pictures
     and counts (pack save 17.1). A bar at the bottom switches design and width (?d=a|b|c&w=390); at
     390 the page shows itself in an iframe that wide. The layers, options and sections really work.
     Chosen 30 Sep: A (built in js/app-map.js filterHtml and css .pgm-sec / .pgm-kind / .switch). -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
body { background: var(--page-bg); background-color: var(--bg); background-attachment: fixed; margin: 0; }
.fv-main { max-width: var(--page-max); margin: 0 auto; padding: var(--sp-8) var(--page-pad) 120px; }
.fv-h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); margin: 0 0 var(--sp-2); }
.fv-lead { max-width: var(--measure); color: var(--ink-2); font-size: var(--fs-sm); margin: 0 0 var(--sp-12); }
.fv-screen { display: block; }
.fv-map { height: 120px; margin-bottom: var(--sp-6); display: grid; place-items: center; color: var(--muted); font-size: var(--fs-sm);
  border: 1px dashed var(--inv-line); }
.fv-bar { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--sp-2) var(--sp-8);
  padding: var(--sp-3) var(--sp-4); background: var(--card); border-top: 1px solid var(--line-panel); font-size: var(--fs-sm); }
.fv-bar span { color: var(--muted); font-family: var(--font-num); font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; }
.fv-bar button { color: var(--ink-2); padding: var(--sp-1) 0; border-bottom: 1px solid transparent; margin-left: var(--sp-3); }
.fv-bar button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.fv-iframe { display: block; margin: 0 auto; border: 1px solid var(--line-panel); background: var(--bg); }

/* ── Common: the filter's head (title, the three options, all / none) ── */
.fv-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3) var(--sp-6); margin-bottom: var(--sp-4); }
.fv-title { font-family: var(--font-display); font-size: var(--fs-sm); font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--ink-strong); margin: 0; }
.fv-opts { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-6); flex: 1; }
.fv-all { display: flex; gap: var(--sp-4); }
/* A switch: a track with a knob, lit in the accent when on (the accent marks what responds). */
.fv-sw { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--ink-2); cursor: pointer; }
.fv-sw i { position: relative; flex: none; width: 30px; height: 16px; border-radius: 8px; border: 1px solid var(--line-ctl); background: var(--card); transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.fv-sw i::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: translate var(--dur) var(--ease), background var(--dur) var(--ease); }
.fv-sw[aria-pressed="true"] { color: var(--ink); }
.fv-sw[aria-pressed="true"] i { background: var(--accent-soft); border-color: var(--accent); }
.fv-sw[aria-pressed="true"] i::after { translate: 14px 0; background: var(--accent); }
.fv-art { flex: none; display: inline-block; overflow: hidden; width: 28px; height: 28px; transition: opacity var(--dur) var(--ease), filter var(--dur) var(--ease); }
.fv-art > img, .fv-art > svg { display: block; width: 100%; height: 100%; max-width: none; object-fit: contain; }
.fv-n { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
.fv-n b { color: var(--ink-strong); font-weight: 600; }
.fv-n.is-full b { color: var(--good); }
.is-off .fv-art { opacity: 0.3; filter: grayscale(1); }
.is-off .fv-name, .is-off .fv-n b { color: var(--muted); }

/* ── A · the sister's: sections that fold; the picture is the switch ── */
.fa-sec { border-top: 1px solid var(--inv-line); }
.fa-sec:last-child { border-bottom: 1px solid var(--inv-line); }
.fa-sec-h { display: flex; align-items: center; gap: var(--sp-3); }
.fa-sec-h > button:first-child { display: flex; align-items: center; gap: var(--sp-3); flex: 1; min-height: var(--ctl); text-align: left; color: var(--ink-strong); }
.fa-caret { width: 10px; height: 10px; flex: none; transition: rotate var(--dur) var(--ease); color: var(--lamp, var(--accent)); }
.fa-sec.is-open .fa-caret { rotate: 90deg; }
.fa-sec-t { font-family: var(--font-display); font-size: var(--fs-sm); font-weight: 600; letter-spacing: var(--track-caps); text-transform: uppercase; }
.fa-sec-body { display: none; flex-wrap: wrap; gap: var(--sp-2) var(--sp-6); padding: 0 0 var(--sp-4) var(--sp-6); }
.fa-sec.is-open .fa-sec-body { display: flex; }
.fa-chip { display: inline-flex; align-items: center; gap: var(--sp-2); padding: var(--sp-1) 0; font-size: var(--fs-sm); color: var(--ink); }
.fa-chip:hover .fv-name { color: var(--accent); }

/* ── B · cards ── */
.fb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: var(--sp-4); align-items: start; }
.fb-card { padding: var(--sp-4); background: color-mix(in oklab, var(--card) 70%, transparent); border: 1px solid var(--inv-line); }
.fb-card-h { display: flex; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-2); }
.fb-card-h .fv-title { flex: 1; }
.fb-meter { height: 2px; margin-bottom: var(--sp-3); background: var(--inv-line); }
.fb-meter i { display: block; height: 100%; background: var(--lamp, var(--accent)); }
.fb-row { display: flex; align-items: center; gap: var(--sp-3); width: 100%; padding: var(--sp-1) 0; text-align: left; }
.fb-row .fv-name { flex: 1; }

/* ── C · compact legend ── */
.fc-row { display: flex; align-items: center; gap: var(--sp-2) var(--sp-4); padding: var(--sp-2) 0; border-top: 1px solid var(--inv-line); flex-wrap: wrap; }
.fc-lbl { width: 170px; flex: none; font-family: var(--font-num); font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--label); }
.fc-icons { display: flex; flex-wrap: wrap; gap: var(--sp-2); flex: 1; }
.fc-ic { position: relative; display: grid; place-items: center; width: 48px; height: 48px; border: 1px solid transparent; }
.fc-ic:hover, .fc-ic:focus-visible { border-color: var(--accent-line); }
.fc-ic .fv-art { width: 32px; height: 32px; }
.fc-badge { position: absolute; right: -4px; bottom: -2px; padding: 0 3px; background: var(--bg); font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: var(--fs-2xs); color: var(--ink-2); }
.fc-tip { position: absolute; z-index: 2; bottom: calc(100% + 4px); left: 50%; translate: -50% 0; padding: var(--sp-1) var(--sp-2); background: var(--card); border: 1px solid var(--line-panel);
  font-size: var(--fs-xs); color: var(--ink); white-space: nowrap; display: none; }
.fc-ic:is(:hover, :focus-visible) .fc-tip { display: block; }
@media (max-width: 599px) {
  .fv-head { flex-direction: column; align-items: flex-start; }
  .fv-opts { flex-direction: column; }
  .fc-lbl { width: 100%; }
  .fc-ic { width: 72px; height: auto; padding: var(--sp-1) 0; gap: 2px; align-content: start; }
  .fc-badge { right: 6px; top: 22px; bottom: auto; }
  .fc-ic .fc-tip { display: block; position: static; translate: none; border: 0; background: none; padding: 0; font-size: var(--fs-2xs); color: var(--muted); white-space: normal; text-align: center; }
}
</style>
</head>

      ${g.layers.map((l, li) => `<button type="button" class="fb-row fv-sw${l.on ? '' : ' is-off'}" data-l="${gi}.${li}" aria-pressed="${l.on}"><span class="fv-art">${l.art}</span><span class="fv-name">${l.name}</span>${cnt(l.got, l.max)}<i></i></button>`).join('')}</section>`; }).join('') + '</div>';
  } else {
    h += DATA.map((g, gi) => `<div class="fc-row"><span class="fc-lbl">${g.t}</span><div class="fc-icons">${g.layers.map((l, li) => `<button type="button" class="fc-ic${l.on ? '' : ' is-off'}" data-l="${gi}.${li}" aria-pressed="${l.on}" aria-label="${l.name}"><span class="fv-art">${l.art}</span>${l.max ? `<span class="fc-badge">${l.got}/${l.max}</span>` : ''}<span class="fc-tip">${l.name}</span></button>`).join('')}</div></div>`).join('');
  }
  document.getElementById('filter').innerHTML = h;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('#filter button'); if (!b) return;
  if (b.dataset.l) { const [g, l] = b.dataset.l.split('.').map(Number); DATA[g].layers[l].on = !DATA[g].layers[l].on; }
  else if (b.dataset.fold) { const i = +b.dataset.fold; if (open.has(i)) open.delete(i); else open.add(i); }
  else if (b.dataset.sec) { const g = DATA[+b.dataset.sec], v = !g.layers.every((l) => l.on); g.layers.forEach((l) => { l.on = v; }); }
  else if (b.dataset.all) { DATA.forEach((g) => g.layers.forEach((l) => { l.on = b.dataset.all === '1'; })); }
  else if (b.dataset.opt) { opts[b.dataset.opt] = !opts[b.dataset.opt]; }
  else return;
  render();
});
render();
</script>
</body>
</html>

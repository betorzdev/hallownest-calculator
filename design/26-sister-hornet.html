<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sister link with Hornet</title>
<!-- Design material, not part of the site. A way to the sister site (../pharloom-calculator, the
   Silksong one) from the masthead, and Hornet coming to point it out. Albert (1 Oct 2026): a button
   to go to the sister, highlighted somehow, with Hornet appearing and doing something to catch the
   eye; built but hidden until the other site is published.
   In every variant the link itself is the same: «Silksong ↗» after Share, in the masthead's loose
   text. The attention stops for good once it's clicked or dismissed (localStorage), and then only
   the link stays. Reduced motion: she's simply there, standing, no run or swing.
     A · She runs in: from the window's right edge along the masthead's top row (beside the
         filigree) to the link, stops over it, turns, stands there. Once per visit, until clicked.
     B · She drops on her silk: hanging from the top edge over the link, she comes down on her
         thread, swings to a stop and stays there; a small plate under her names the sister.
     C · A plate under the masthead: Hornet standing beside a line («The Silksong calculator is
         here») and a ×; every few seconds she glints (her Bind's white light).
   Sprites: the sister's own (../pharloom-calculator/assets/hornet/, its tools/extract-hornet.py).
   ?v=a|b|c; &end=1 shows where each one ends. -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
body { background: var(--page-bg); background-attachment: fixed; margin: 0; }
.mk { max-width: 1180px; margin: 0 auto; padding: var(--sp-6) var(--page-pad) var(--sp-16); }
.mk-h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); margin: 0 0 var(--sp-2); }
.mk-lead { max-width: var(--measure); color: var(--ink-2); font-size: var(--fs-sm); margin: 0 0 var(--sp-4); }
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); padding: var(--sp-2) 0; margin-bottom: var(--sp-6); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--muted); }
.mk-bar b { font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--label); font-weight: 600; }
.mk-bar button { background: none; border: 0; padding: var(--sp-1) 0; font: inherit; color: var(--muted); cursor: pointer; }
.mk-bar button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent-line); }
.mk-note { max-width: var(--measure); margin: 0 auto var(--sp-6); color: var(--ink-2); font-size: var(--fs-sm); text-align: center; min-height: 3em; }
.mk-stage { position: relative; overflow: hidden; border: 1px dashed var(--line); padding: 0 var(--sp-6) var(--sp-12); }
.mk-fake { margin-top: var(--sp-8); height: 220px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-sm); padding-top: var(--sp-3); }

/* ════ What would go into the site ════ */
/* The link: one more loose word in the masthead's tools, after Share. */
.mh-sister { position: relative; display: inline-flex; align-items: center; gap: var(--sp-1); min-height: var(--ctl-sm); color: var(--ink-2); text-decoration: none; font-size: var(--fs-sm); letter-spacing: var(--track-label); }
.mh-sister:hover { color: var(--accent-ink); }
.mh-sister .arr { font-size: var(--fs-2xs); }

/* Hornet: the sister's strips, 120 × 120 cells, facing left. */
.sh { --n: 1; --h: 56px; position: absolute; width: var(--h); height: var(--h); background: url(../pharloom-calculator/assets/hornet/stand.png) 0 0 / auto 100% no-repeat; pointer-events: none; }
.sh.is-run { background-image: url(../pharloom-calculator/assets/hornet/run.png); --n: 10; animation: sh-cycle calc(var(--dur-step) * 10) steps(10) infinite; }
.sh.is-right { scale: -1 1; }
@keyframes sh-cycle { to { background-position-x: calc(-1 * var(--h) * var(--n)); } }

/* A · she runs in along the masthead's line and stands at the link's right. */
.va .sh { top: var(--sh-top, 0); left: var(--to); }
.va .sh.is-run { animation: sh-cycle calc(var(--dur-step) * 10) steps(10) infinite, sh-run var(--t) linear both; }
@keyframes sh-run { from { left: var(--from); } to { left: var(--to); } }
.mk-stage .seg.langsel { flex-wrap: nowrap; }
/* B · on her silk, from the stage's top edge. */
.sh-silk { position: absolute; top: 0; width: 1px; transform-origin: 50% 0; pointer-events: none; }
.sh-silk::before { content: ''; position: absolute; left: 0; top: 0; width: 1px; height: var(--len, 0); background: linear-gradient(var(--ink-2), var(--ink-strong)); opacity: 0.7; }
.sh-silk .sh { position: absolute; left: calc(var(--h) / -2); top: calc(var(--len, 0) - 6px); }
.sh-silk.is-drop { animation: sh-drop 900ms cubic-bezier(0.3, 1.3, 0.5, 1) both, sh-swing 2.6s var(--ease-fade) 900ms 3 alternate; }
@keyframes sh-drop { from { --len: 0px; opacity: 0; } 20% { opacity: 1; } to { --len: var(--drop); } }
@keyframes sh-swing { from { rotate: 6deg; } to { rotate: -6deg; } }
@property --len { syntax: '<length>'; inherits: true; initial-value: 0px; }
.sh-silk:not(.is-drop) { --len: var(--drop); }
.sh-tag { position: absolute; top: calc(var(--drop) + var(--h, 56px) + 22px); left: 50%; translate: -50% 0; white-space: nowrap; font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--ink-strong); opacity: 0; animation: fade-in var(--dur-slow) var(--ease-fade) 1.1s forwards; }
@keyframes fade-in { to { opacity: 1; } }

/* C · a plate under the masthead. */
.sp { position: relative; display: flex; align-items: center; gap: var(--sp-4); max-width: 640px; margin: var(--sp-6) auto 0; padding: var(--sp-2) var(--sp-4) var(--sp-2) var(--sp-2); border: 1px solid var(--line); background: var(--veil); }
.sp .sh { position: static; flex: none; --h: 56px; }
.sp .sh.is-glint { animation: sh-glint var(--dur-flash) var(--ease-fade); }
@keyframes sh-glint { 40% { filter: drop-shadow(0 0 3px var(--focus-glow)) drop-shadow(0 0 14px var(--focus-glow)); } }
.sp-t { flex: 1; font-size: var(--fs-sm); color: var(--ink); }
.sp-t b { font-family: var(--font-display); color: var(--ink-strong); font-weight: 600; }
.sp-go { color: var(--accent-ink); text-decoration: none; font-size: var(--fs-sm); white-space: nowrap; }
.sp-x { background: none; border: 0; color: var(--muted); font-size: var(--fs-lg); cursor: pointer; min-width: var(--ctl-sm); min-height: var(--ctl-sm); }
</style>
</head>
<body>
<div class="mk">
  <h1 class="mk-h1">Sister link with Hornet</h1>
  <p class="mk-lead">A «Silksong ↗» link to the Pharloom Calculator in the masthead, and Hornet coming to point it out. Once clicked or dismissed, the effect never comes back: only the link stays.</p>
  <div class="mk-bar" id="bar"></div>
  <p class="mk-note" id="note"></p>
  <div class="mk-stage" id="stage"></div>
</div>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const st = { v: q.get('v') || 'a' };
const END = q.has('end');   // straight to where each one ends (for screenshots)
const V = {
  a: ['A · She runs in', 'From the right edge she runs along the masthead\'s top row, past the filigree, to the link; she stops over it, looks back and stays standing there. Movement across the whole width is what catches the eye, and it ends quiet. On a phone the masthead is one row: she runs the same line, smaller.'],
  b: ['B · She drops on her silk', 'Hanging from the top of the window over the link, she comes down on her thread (as she does in Silksong), swings three times to a stop and stays there, with the sister\'s name under her. The most Hornet of the three; it takes space above the tools, so on a phone she hangs smaller.'],
  c: ['C · A plate under the masthead', 'A plate the width of the content: Hornet standing, a line saying the Silksong calculator is here, the link and a ×. Every few seconds she glints with her Bind\'s white light. The clearest to read, the most like an ad; the masthead link stays when it\'s gone.'],
};
const bar = document.getElementById('bar'), note = document.getElementById('note'), stage = document.getElementById('stage');
function renderBar() {
  bar.innerHTML = '<b>Variant</b>' + Object.keys(V).map((k) => `<button type="button" data-v="${k}" aria-pressed="${st.v === k}">${V[k][0]}</button>`).join('')
    + '<b>·</b><button type="button" data-replay>Replay ↻</button>';
}
const masthead = `<header class="masthead">
  <div class="mh-tools">
    <div class="seg langsel" role="group"><button type="button" aria-pressed="false">EN</button><button type="button" aria-pressed="true">ES</button></div>
    <button type="button" class="text-btn mh-link">Compartir</button>
    <a class="mh-sister" id="sister" href="https://betorzdev.github.io/pharloom-calculator/" target="_blank" rel="noopener">Silksong <span class="arr">↗</span></a>
  </div>
  <a class="brand" href="#"><img class="mh-hdr" src="assets/hall/tablet-hdr.png" alt="" width="862" height="111"><p class="title">Calculadora de Hallownest</p></a>
  <a class="mh-save" href="#"><span class="mh-save-fig"><span class="mh-save-light"></span><img src="assets/hud/knight.png" alt=""></span><span class="mh-save-lbl">Partida 4</span></a>
</header>`;
function render() {
  renderBar();
  note.textContent = V[st.v][1];
  stage.className = 'mk-stage v' + st.v;
  stage.innerHTML = masthead + (st.v === 'c'
    ? `<div class="sp"><span class="sh" id="sh"></span><span class="sp-t"><b>Calculadora de Telalejana</b> · la de Silksong ya está aquí.</span><a class="sp-go" href="#">Ir ↗</a><button class="sp-x" type="button" aria-label="Cerrar">×</button></div>`
    : '') + '<div class="mk-fake">(the screen bar and the page below)</div>';
  setTimeout(play, 50);
}
function play() {
  const link = document.getElementById('sister');
  const sr = stage.getBoundingClientRect(), lr = link.getBoundingClientRect();
  if (st.v === 'a') {
    const h = 56, y = lr.top - sr.top - h + 10;
    const sh = document.createElement('span');
    sh.className = END ? 'sh' : 'sh is-run'; sh.style.setProperty('--sh-top', y + 'px');
    stage.append(sh);
    const from = sr.width + 10, to = lr.left + lr.width / 2 - sr.left - h / 2;
    const px = from - to;
    sh.style.cssText += `--from:${from}px;--to:${to}px;--t:${px / 100 * 260}ms`;
    sh.addEventListener('animationend', (e) => { if (e.animationName !== 'sh-run') return; sh.className = 'sh'; setTimeout(() => sh.classList.add('is-right'), 120); setTimeout(() => sh.classList.remove('is-right'), 2400); });
  } else if (st.v === 'b') {
    const silk = document.createElement('span');
    silk.className = END ? 'sh-silk' : 'sh-silk is-drop';
    silk.style.left = (lr.left + lr.width / 2 - sr.left) + 'px';
    silk.style.setProperty('--drop', (lr.top - sr.top - 56 + 6) + 'px');
    silk.innerHTML = '<span class="sh"></span><span class="sh-tag">Telalejana</span>';
    stage.append(silk);
  } else {
    const sh = document.getElementById('sh');
    const glint = () => { if (!sh.isConnected) return; sh.classList.remove('is-glint'); void sh.offsetWidth; sh.classList.add('is-glint'); setTimeout(glint, 4000); };
    setTimeout(glint, 800);
  }
}
bar.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.v) { st.v = b.dataset.v; history.replaceState(null, '', '?v=' + st.v); }
  render();
});
render();
</script>
</body>
</html>

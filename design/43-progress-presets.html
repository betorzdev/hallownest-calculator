<title>Starting points on Progress</title>
<!-- Design material, not part of the site. Albert (16 Oct 2026): «en inventory hay un boton, en
     modo libre, para marcar "base knight" o todo conseguido. no añadirias algo parecido en
     progress?».

     Why: free mode starts with everything unlocked (the build maxed, every charm found), so a
     first visit's Progress already reads 65 % with nothing marked. Someone on a console, ticking
     their game by hand, starts from a tablet half lit. Two starting points, as the Inventory's
     («Empezar desde», presetsLbl), only in free mode (a save is read, not changed): «Partida
     nueva» / "New Game" (the game's PROFILE_NEW_GAME) clears everything the 112% counts, and
     «Todo conseguido» / "Everything done" marks it all. Progress marks where the site keeps
     things, so both also move the charms found, the Journal's 112% entries and the build.
     The one that would change nothing is disabled (as All · None on the charms found).
       A · under the title     as the Inventory: a lead line under the plaque, over the tabs
                               (only with the Completion tab on).
       B · under the figure    the line under «65 % / 112», the figure it changes.
       C · beside the switch   on the row of «Solo lo que falta», at its left.
     The page's markup is the site's own, dumped from #pg in free mode and after the base preset.
     The bar switches variant, state, width and language; ?v=b&s=free&w=phone&lang=es. -->

<style>
body { background: var(--page-bg); background-attachment: fixed; margin: 0; }
.tv-wrap { max-width: 1180px; margin: 0 auto; padding: var(--sp-8) var(--page-pad) 160px; }
.tv-phone { display: block; margin: 0 auto; width: 390px; height: 1500px; border: 1px solid var(--line-panel); background: var(--page-bg); }
.is-embed .tv-wrap { padding: var(--sp-4) var(--sp-3) var(--sp-8); }
.tv-bar { position: fixed; z-index: 100; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2) var(--sp-8);
  padding: var(--sp-3) var(--sp-4); background: var(--card); border-top: 1px solid var(--line-panel); font-size: var(--fs-sm); }
.is-embed .tv-bar { display: none; }
.tv-grp { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-1) var(--sp-3); }
.tv-lbl { color: var(--muted); font-family: var(--font-num); font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; }
.tv-bar button { color: var(--ink-2); padding: var(--sp-1) 0; border-bottom: 1px solid transparent; }
.tv-bar button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tv-bar button .rec { color: var(--muted); font-size: var(--fs-2xs); }
.ctx { color: var(--muted); font-size: var(--fs-xs); margin: 0 auto var(--sp-6); max-width: 900px; }

/* B · under the figure: the same line as the Inventory's, closer to the number it changes. */
.pg-total .presets.gx-b { margin-top: var(--sp-3); }
/* C · beside the switch: the row spreads, the starting points on the left. */
.pg-opts.gx-c { justify-content: space-between; align-items: center; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); }
.pg-opts.gx-c .presets { margin-top: 0; justify-content: flex-start; }
@media (max-width: 640px) { .pg-opts.gx-c .presets .lbl { flex: 0 0 auto; text-align: left; } }
</style>

const T = {
  es: { lbl: 'Empezar desde', zero: 'Partida nueva', all: 'Todo conseguido',
        zeroHint: 'Como al empezar la partida: nada de lo que cuenta para el 112 %, ni amuletos, ni entradas del Diario, ni mejoras',
        allHint: 'Todo lo que cuenta para el 112 % conseguido' },
  en: { lbl: 'Start from', zero: 'New Game', all: 'Everything done',
        zeroHint: 'As at the start of the game: nothing the 112% counts, no charms, no Journal entries, no upgrades',
        allHint: 'Everything the 112% counts, done' },
};
const CTX = {
  es: 'Modo libre. «Partida nueva» deja todo lo que cuenta para el 112 % a cero (también amuletos, Diario y build); «Todo conseguido» lo marca entero. El que no cambiaría nada sale desactivado. En una partida del juego no aparecen.',
  en: 'Free mode. "New Game" clears everything the 112% counts (charms, Journal and build too); "Everything done" marks it all. The one that would change nothing is disabled. Not shown in a game save.',
};
const q = new URLSearchParams(location.search);
const st = { v: q.get('v') || 'b', s: q.get('s') || 'free', w: q.get('w') || 'desk', lang: q.get('lang') || 'es' };
const embed = q.get('embed') === '1';
if (embed) document.body.classList.add('is-embed');

function presets(cls, s, l) {
  const t = T[l];
  return '<div class="presets ' + cls + '"><span class="lbl">' + t.lbl + '</span>'
    + '<button type="button" class="text-btn" title="' + t.zeroHint + '"' + (s === 'zero' ? ' disabled' : '') + '>' + t.zero + '</button>'
    + '<span class="presets-sep" aria-hidden="true">·</span>'
    + '<button type="button" class="text-btn" title="' + t.allHint + '">' + t.all + '</button></div>';
}
function build(v, s, l) {
  let h = DUMP[l + '-' + s];
  if (v === 'a') h = h.replace('</header>', '</header><div class="screen-lead">' + presets('gx-a', s, l) + '</div>');
  if (v === 'b') h = h.replace(/(<span class="pg-total-v">[\s\S]*?<\/span><\/span>)/, '$1' + presets('gx-b', s, l));
  if (v === 'c') h = h.replace('<div class="pg-opts">', '<div class="pg-opts gx-c">' + presets('', s, l));
  return '<section class="gear pg">' + h + '</section>';
}
function paint() {
  const wrap = document.getElementById('wrap');
  const qs = 'v=' + st.v + '&s=' + st.s + '&lang=' + st.lang;
  if (!embed) try { history.replaceState(null, '', location.pathname + '?' + qs + '&w=' + st.w); } catch (e) { /* file:// may refuse */ }
  document.documentElement.lang = st.lang;
  if (st.w === 'phone' && !embed) wrap.innerHTML = '<p class="ctx">' + CTX[st.lang] + '</p><iframe class="tv-phone" src="design/43-progress-presets.html?embed=1&' + qs + '"></iframe>';
  else wrap.innerHTML = (embed ? '' : '<p class="ctx">' + CTX[st.lang] + '</p>') + '<main class="screens">' + build(st.v, st.s, st.lang) + '</main>';
  const grp = (k, label, opts) => '<div class="tv-grp"><span class="tv-lbl">' + label + '</span>' + opts.map(([v, txt]) =>
    '<button type="button" data-k="' + k + '" data-v="' + v + '" aria-pressed="' + (st[k] === v) + '">' + txt + '</button>').join('') + '</div>';
  document.getElementById('bar').innerHTML =
    grp('v', 'Variante', [['b', 'B · Bajo la cifra <span class="rec">(Recomendado)</span>'], ['a', 'A · Bajo el título'], ['c', 'C · Junto al interruptor']])
    + grp('s', 'Estado', [['free', 'Modo libre (65 %)'], ['zero', 'Tras Partida nueva (0 %)']])
    + grp('w', 'Ancho', [['desk', 'Escritorio'], ['phone', 'Móvil']])
    + grp('lang', 'Idioma', [['es', 'ES'], ['en', 'EN']]);
}
document.getElementById('bar').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]');
  if (!b) return;
  st[b.dataset.k] = b.dataset.v; paint();
});
paint();
</script>

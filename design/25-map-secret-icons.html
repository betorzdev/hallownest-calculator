<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map secret icons</title>
<!-- Design material, not part of the site. The Map's three drawn icons (js/app-map.js GLYPH: wall,
   hidden, chest), which Albert doesn't like (1 Oct 2026): flat pale shapes, generic, unlike the
   game's own pictures next to them (the totem, the tablet, the pins). Each candidate drawn where it
   shows: on a map pin (its dark disc, ~22 px), as the filter's layer picture (28 px) and on the
   card (36 px).
   The game's art, read from its files (UnityPy, the throwaway venv; tools/extract-scenes.py's way):
     · the geo chest: tk2d collection "Chest" (sharedassets6, sprite chest0000, closed) — design/25/chest.png;
     · a breakable wall: one per area, tall and nearly black (cr10_break_wall, the Crossroads') —
       design/25/wall-crossroads.png: at icon size it doesn't read, shown only to compare.
     · hidden places: the game has no picture (a black mask that lifts), so only drawn ones.
   Chosen on 1 Oct 2026: the chest, the game's; walls, B; hidden places, A (built: js/app-map.js
   GLYPH, css/app.css .pgm-glyph-cut, assets/world/chest.png by tools/extract-scenes.py --art).
   ?lang=es. -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
body { background: var(--page-bg); background-attachment: fixed; margin: 0; }
.mk { max-width: 1100px; margin: 0 auto; padding: var(--sp-6) var(--page-pad) var(--sp-16); }
.mk-h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); margin: 0 0 var(--sp-2); }
.mk-lead { max-width: var(--measure); color: var(--ink-2); font-size: var(--fs-sm); margin: 0 0 var(--sp-8); }
.mk-h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-md); letter-spacing: var(--track-caps); text-transform: uppercase; color: var(--ink-strong); margin: var(--sp-12) 0 var(--sp-4); }
.mk-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--sp-6); }
.cand { display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-4); border: 1px solid var(--line); }
.cand h3 { margin: 0; font-size: var(--fs-sm); color: var(--ink); font-weight: 600; }
.cand p { margin: 0; font-size: var(--fs-xs); color: var(--muted); }
.cand.is-now { border-style: dashed; }
.uses { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3) var(--sp-4); }
/* the three places it shows */
.pin { width: 26px; height: 26px; }
.pin circle { fill: var(--bg); stroke: var(--line-ctl); stroke-width: 0.06; }
.u-chip { display: inline-flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-sm); color: var(--ink); }
.u-chip svg, .u-chip img { width: 28px; height: 28px; object-fit: contain; }
.u-chip.is-off svg, .u-chip.is-off img { filter: var(--missing-art); }
.u-chip.is-off { color: var(--muted); }
.u-card svg, .u-card img { width: 36px; height: 36px; object-fit: contain; }
.u-big svg, .u-big img { width: 72px; height: 72px; object-fit: contain; }
.u-big { display: grid; place-items: center; height: 84px; }
.mapbg { background: #0d1016; padding: var(--sp-2); }
/* drawn candidates */
.g { fill: var(--ink-strong); }
.gl { fill: none; stroke: var(--ink-strong); stroke-width: 0.06; stroke-linecap: round; stroke-linejoin: round; }
.gc { fill: none; stroke: var(--bg); stroke-width: 0.05; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="mk">
  <h1 class="mk-h1">Map secret icons</h1>
  <p class="mk-lead">The Map's breakable walls, hidden places and geo chests: as now (dashed), the game's own picture where it has one, and drawn ones in the game's pin style. Each where it shows: on a pin over the map, as the filter's layer picture (on and off) and on the card.</p>
  <div id="stage"></div>
</div>
<script>
'use strict';
// Drawn in the map's units, as js/app-map.js GLYPH (viewBox -0.5..0.5).
const NOW = {
  wall: '<g class="g"><rect x="-0.3" y="-0.26" width="0.28" height="0.14"/><rect x="0.02" y="-0.26" width="0.28" height="0.14"/><rect x="-0.14" y="-0.07" width="0.28" height="0.14"/><path d="M-0.3 0.12 H-0.02 V0.26 H-0.3 Z M0.02 0.12 L0.12 0.2 L0.08 0.26 H0.3 V0.12 Z"/></g>',
  hidden: '<g class="gl"><path d="M-0.2 0.28 V-0.08 A0.2 0.2 0 0 1 0.2 -0.08 V0.28 Z" stroke-dasharray="0.08 0.06"/></g>',
  chest: '<g class="g"><path d="M-0.3 -0.04 V-0.12 A0.3 0.14 0 0 1 0.3 -0.12 V-0.04 Z M-0.3 0 H0.3 V0.24 H-0.3 Z"/></g>',
};
const DRAWN = {
  // A wall split by a crack, its pieces falling: what breaks.
  wallCrack: '<g class="g"><path d="M-0.32 -0.3 H-0.03 L-0.08 -0.14 L0.01 -0.02 L-0.06 0.12 L-0.01 0.3 H-0.32 Z"/><path d="M0.05 -0.3 H0.32 V0.3 H0.07 L0.02 0.14 L0.09 0.0 L0.0 -0.14 Z"/></g><g class="gc"><path d="M-0.32 -0.1 H-0.09 M-0.32 0.1 H-0.07 M0.03 -0.1 H0.32 M0.06 0.1 H0.32 M-0.2 -0.3 V-0.1 M0.18 -0.1 V0.1 M-0.18 0.1 V0.3"/></g>',
  // Bricks with a hole knocked through: the way opened.
  wallBreach: '<g class="g"><path d="M-0.34 -0.3 H0.34 V0.3 H-0.34 Z M-0.1 -0.06 L0.04 -0.16 L0.16 -0.04 L0.12 0.14 L-0.04 0.18 L-0.16 0.06 Z" fill-rule="evenodd"/></g><g class="gc"><path d="M-0.34 -0.1 H-0.14 M0.2 -0.1 H0.34 M-0.34 0.1 H-0.18 M0.16 0.1 H0.34 M-0.06 -0.3 V-0.14 M0.18 0.1 V0.3 M-0.2 0.1 V0.3 M0.12 -0.3 V-0.12"/></g>',
  // An archway half veiled, a glint in it: a place that's there but hidden.
  hiddenArch: '<g class="gl"><path d="M-0.24 0.3 V-0.04 A0.24 0.24 0 0 1 0.24 -0.04 V0.3"/></g><g class="g"><path d="M-0.24 0.3 V0.06 Q0 -0.04 0.24 0.1 V0.3 Z" opacity="0.55"/><path d="M0.02 -0.2 L0.05 -0.1 L0.15 -0.07 L0.05 -0.04 L0.02 0.06 L-0.01 -0.04 L-0.11 -0.07 L-0.01 -0.1 Z"/></g>',
  // An eye: what you can find by looking.
  hiddenEye: '<g class="gl"><path d="M-0.34 0 Q0 -0.3 0.34 0 Q0 0.3 -0.34 0 Z"/></g><g class="g"><circle r="0.11"/></g>',
  // A drawn chest, the game's shape (a dome over a box, a lock).
  chestDrawn: '<g class="g"><path d="M-0.32 0.02 V-0.06 Q-0.3 -0.3 0 -0.3 Q0.3 -0.3 0.32 -0.06 V0.02 Z M-0.3 0.06 H0.3 V0.28 H-0.3 Z"/></g><g class="gc"><circle cy="0.04" r="0.07"/><path d="M-0.12 -0.28 V0.02 M0.12 -0.28 V0.02"/></g>',
};
const svg = (body, cls = '') => `<svg class="${cls}" viewBox="-0.5 -0.5 1 1" aria-hidden="true">${body}</svg>`;
const pinOf = (inner) => `<svg class="pin" viewBox="-0.6 -0.6 1.2 1.2" aria-hidden="true"><circle r="0.5"/>${inner}</svg>`;
const img = (src) => `<img src="${src}" alt="">`;
const pinImg = (src) => `<svg class="pin" viewBox="-0.6 -0.6 1.2 1.2" aria-hidden="true"><circle r="0.5"/><image href="${src}" x="-0.46" y="-0.46" width="0.92" height="0.92"/></svg>`;
function cand(title, note, art, now = false) {
  const isImg = art.startsWith('design/');
  const pin = isImg ? pinImg(art) : pinOf(art), pic = isImg ? img(art) : svg(art);
  return `<div class="cand${now ? ' is-now' : ''}"><h3>${title}</h3><p>${note}</p>
    <div class="u-big">${pic}</div>
    <div class="uses"><span class="mapbg">${pin}</span><span class="u-chip">${pic}Capa</span><span class="u-chip is-off">${pic}Apagada</span><span class="u-card">${pic}</span></div></div>`;
}
const S = [
  ['Muros y suelos que se rompen', [
    cand('Ahora', 'Ladrillos planos.', NOW.wall, true),
    cand('A · Muro partido', 'Dos mitades separadas por una grieta, con sus juntas: «se rompe».', DRAWN.wallCrack),
    cand('B · Muro con boquete', 'Ladrillos con un agujero abierto: «se abre paso».', DRAWN.wallBreach),
    cand('C · El del juego', 'Un muro rompible de las Cruces (cr10_break_wall). A este tamaño es casi negro: solo para comparar.', 'design/25/wall-crossroads.png'),
  ]],
  ['Zonas ocultas', [
    cand('Ahora', 'Arco discontinuo.', NOW.hidden, true),
    cand('A · Arco velado', 'Un arco con su mitad baja en sombra y un destello: hay algo detrás.', DRAWN.hiddenArch),
    cand('B · Ojo', 'Un ojo: lo que encuentras mirando.', DRAWN.hiddenEye),
  ]],
  ['Cofres de geo', [
    cand('Ahora', 'Caja plana con tapa.', NOW.chest, true),
    cand('A · El del juego', 'El cofre de geo tal como lo dibuja el juego (chest0000, cerrado).', 'design/25/chest.png'),
    cand('B · Dibujado', 'La forma del cofre del juego (cúpula sobre caja, cerradura), plano como los demás símbolos.', DRAWN.chestDrawn),
  ]],
];
document.getElementById('stage').innerHTML = S.map(([h, cs]) => `<h2 class="mk-h2">${h}</h2><div class="mk-row">${cs.join('')}</div>`).join('');
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hornet's moves</title>
<!-- Design material, not part of the site. Round 2 of the sister link (design/26-sister-hornet.html):
   Albert (1 Oct 2026) liked A (she runs in), with Hornet smaller, and asked for more animations,
   original and spectacular: "design everything and show me, I'll pick later". Her moves are the
   game's own, drawn by tools/extract-hornet.py into assets/hornet/ + js/hornet-moves.js.
   Composable: an arrival, then what she does while she waits, and how she leaves on the click.
     Arrivals · 0 she runs in (round 1, smaller) · 1 needle & silk: she throws her needle into the
       link, the thread goes taut and she pulls herself along it (Clawline) · 2 stitches the link:
       a dash over the word leaves a silk thread woven through its letters, then she cinches it into
       an underline · 3 meets the Knight: she floats down by your save's Knight, a flourish at him,
       and a winged jump over the title to the link · 4 drops from above: floating down on her cloak
       onto the title, then a winged jump to the link.
     While she waits · life: now and then she shakes out her cloak, looks up, plays the Needolin or
       sits · the mouse: she watches the cursor and spins into guard when it's on the link.
     On the click · Silk Soar up and out, a curled leap, or a backflip (the link opens the sister in
       a new tab; here it doesn't).
   ?a=0..4 &life=0 &hover=0 &exit=soar|leap|flip|none &size=s|m &still=1 (reduced motion) &end=1
   (straight to where she ends) &do=flourish|look|needolin|sit|taunt (one move
   of her life at once) &click=ms (clicks the link) &w=phone (inside a 390 px frame) &tick=1 (timers instead of frames,
   for headless screenshots). -->
<base href="../">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<style>
body { background: var(--page-bg); background-attachment: fixed; margin: 0; }
.mk { max-width: 1180px; margin: 0 auto; padding: var(--sp-6) var(--page-pad) var(--sp-16); }
.mk-h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); margin: 0 0 var(--sp-2); }
.mk-lead { max-width: var(--measure); color: var(--ink-2); font-size: var(--fs-sm); margin: 0 0 var(--sp-4); }
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); padding: var(--sp-2) 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--muted); }
.mk-bar:last-of-type { margin-bottom: var(--sp-6); }
.mk-bar b { min-width: 5.5em; font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--label); font-weight: 600; }
.mk-bar button { background: none; border: 0; padding: var(--sp-1) 0; font: inherit; color: var(--muted); cursor: pointer; }
.mk-bar button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent-line); }
.mk-note { max-width: var(--measure); margin: 0 auto var(--sp-6); color: var(--ink-2); font-size: var(--fs-sm); text-align: center; min-height: 4.5em; }
.mk-stage { position: relative; overflow: hidden; border: 1px dashed var(--line); padding: 0 var(--sp-6) var(--sp-12); }
.mk-stage .seg.langsel { flex-wrap: nowrap; }
.mk-fake { margin-top: var(--sp-8); height: 160px; border-top: 1px solid var(--line); color: var(--muted); font-size: var(--fs-sm); padding-top: var(--sp-3); }
.mk-frame { display: block; margin: 0 auto; border: 1px solid var(--line); background: var(--page-bg); }
body.is-embed .mk { padding: 0; }
body.is-embed .mk > :not(.mk-stage) { display: none; }
body.is-embed .mk-stage { border: 0; padding-inline: var(--page-pad); }

/* ════ What would go into the site ════ */
/* The link: one more loose word in the masthead's tools, after Share. Once she has called it, it
   carries her silk: bone, with a white glow that breathes three times. */
.mh-sister { position: relative; display: inline-flex; align-items: center; gap: var(--sp-1); min-height: var(--ctl-sm); color: var(--ink-2); text-decoration: none; font-size: var(--fs-sm); letter-spacing: var(--track-label); transition: color var(--dur) var(--ease); }
.mh-sister:hover { color: var(--accent-ink); }
.mh-sister .arr { font-size: var(--fs-2xs); }
.mh-sister.is-called { color: var(--ink-strong); animation: sister-call 1.6s var(--ease-fade) 3; }
.mh-sister.is-struck { animation: sister-struck var(--dur-slow) var(--ease-fade); }
@keyframes sister-call { 50% { text-shadow: 0 0 6px var(--focus-glow), 0 0 14px color-mix(in oklab, var(--ink-strong) 40%, transparent); } }
@keyframes sister-struck { 0% { text-shadow: 0 0 2px var(--focus-glow), 0 0 18px var(--focus-glow); transform: translateX(-2px); } 100% { transform: none; } }

/* Hornet: one element, the strip of her current move as its background; JS steps the frames and
   places her by her pivot (js/hornet-moves.js). She faces left, as the game draws her; facing
   right is a mirror round her pivot. */
.hx { position: absolute; z-index: 3; left: 0; top: 0; background-repeat: no-repeat; pointer-events: none; will-change: transform; }
/* What she leaves: silk (the SVG layer), dust, notes and her cry. */
/* Under the masthead's letters: a thread that crosses the title passes behind it. */
.mk-stage .masthead { position: relative; z-index: 1; }
.fx { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.fx .silk { fill: none; stroke: var(--ink-strong); stroke-width: 1; stroke-linecap: round; opacity: 0.85; }
.fx .silk.is-glint { filter: drop-shadow(0 0 3px var(--focus-glow)); }
.fx .needle { stroke: var(--ink-strong); stroke-width: 1.5; stroke-linecap: round; }
.fx .needle-eye { fill: none; stroke: var(--ink-strong); stroke-width: 1; }
.fx .spark { fill: var(--ink-strong); }
.dust, .note, .shout { position: absolute; z-index: 4; pointer-events: none; }
.dust { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-strong); box-shadow: 0 0 4px var(--focus-glow); }
.note { font-size: var(--fs-md); color: var(--ink-strong); text-shadow: 0 0 6px var(--focus-glow); }
.shout { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-sm); letter-spacing: var(--track-label); color: var(--ink-strong); text-shadow: 0 0 8px var(--focus-glow); white-space: nowrap; }
</style>
</head>
<body>
<div class="mk">
  <h1 class="mk-h1">Hornet's moves</h1>
  <p class="mk-lead">Round 2 of the sister link: Hornet smaller, with her own moves from the game. Pick an arrival, then what she does while she waits and how she leaves when you click «Silksong». Hover the link, move the mouse, click it.</p>
  <div class="mk-bar" id="bar-a"></div>
  <div class="mk-bar" id="bar-b"></div>
  <div class="mk-bar" id="bar-c"></div>
  <p class="mk-note" id="note"></p>
  <div class="mk-stage" id="stage"></div>
</div>
<script src="js/hornet-moves.js"></script>
<script>
'use strict';
const q = new URLSearchParams(location.search);
const opt = {
  a: q.get('a') || '1', life: q.get('life') !== '0', hover: q.get('hover') !== '0', exit: q.get('exit') || 'soar',
  size: q.get('size') || 'm', still: q.get('still') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches,
  end: q.has('end'), w: q.get('w') || 'desk',
};
const EMBED = q.has('embed');
const ARRIVALS = {
  0: ['0 · Runs in', 'Round 1\'s A, smaller: she runs in from the right along the masthead\'s top row, skids to a stop over the link and stands there.'],
  1: ['1 · Needle & silk', 'She runs in and stops by the filigree, draws her needle back and throws it: it flies on its thread and sticks into «Silksong», which flinches and lights up. The thread goes taut, she pulls herself along it (her Clawline) and lands on the link.'],
  2: ['2 · Stitches the link', 'She runs in and dashes over the word: her needle weaves a silk thread through its letters behind her. At the far end she skids, turns to look, the thread cinches into a glinting underline, and a winged jump takes her back over the link.'],
  3: ['3 · Meets the Knight', 'She floats down on her cloak by your save\'s Knight, facing him. He startles; she answers with a flourish and her cry, turns, and a winged jump over the title takes her to the link, landing in a puff of silk.'],
  4: ['4 · Drops from above', 'From the top of the window she floats down on her cloak, swaying, and lands on the title\'s letters. She looks round, then a winged jump carries her to the link, landing in a puff of silk.'],
};
const EXITS = { soar: 'Silk Soar', leap: 'Leap', flip: 'Backflip', none: 'Stays' };
const H = HK.HORNET, M = H.MOVES;
const K = opt.size === 's' ? 0.42 : 0.5;          // the strips are at a third of the game; she's shown at K of that
const FLOOR = H.FLOOR * K;                       // feet below the pivot, standing

/* ── The bars ── */
function link(over, label, on) {
  const p = new URLSearchParams(location.search);
  for (const [k, v] of Object.entries(over)) p.set(k, v);
  p.delete('end'); p.delete('embed');
  return `<button type="button" data-href="?${p}" aria-pressed="${on}">${label}</button>`;
}
document.getElementById('bar-a').innerHTML = '<b>Arrival</b>' + Object.entries(ARRIVALS).map(([k, [n]]) => link({ a: k }, n, opt.a === k)).join('');
document.getElementById('bar-b').innerHTML = '<b>Then</b>'
  + link({ life: opt.life ? 0 : 1 }, 'Life of her own', opt.life) + link({ hover: opt.hover ? 0 : 1 }, 'Reacts to the mouse', opt.hover)
  + '<b>On click</b>' + Object.entries(EXITS).map(([k, n]) => link({ exit: k }, n, opt.exit === k)).join('');
document.getElementById('bar-c').innerHTML = '<b>Size</b>' + link({ size: 'm' }, 'M · 36 px', opt.size === 'm') + link({ size: 's' }, 'S · 30 px', opt.size === 's')
  + '<b>Motion</b>' + link({ still: 0 }, 'Full', !opt.still) + link({ still: 1 }, 'Reduced', opt.still)
  + '<b>Width</b>' + link({ w: 'desk' }, 'Computer', opt.w === 'desk') + link({ w: 'phone' }, 'Phone (390)', opt.w === 'phone')
  + '<b>·</b><button type="button" data-href="' + location.search + '">Replay ↻</button>';
document.addEventListener('click', (e) => { const b = e.target.closest('[data-href]'); if (b) location.search = b.dataset.href.slice(1); });
document.getElementById('note').textContent = ARRIVALS[opt.a][1];
if (EMBED) document.body.classList.add('is-embed');

const stage = document.getElementById('stage');
if (opt.w === 'phone' && !EMBED) {
  const p = new URLSearchParams(location.search); p.set('embed', 1);
  stage.outerHTML = `<iframe class="mk-frame" width="390" height="340" src="design/27-sister-hornet-moves.html?${p}"></iframe>`;
  throw 0;   // the frame plays it
}
stage.innerHTML = `<header class="masthead">
  <div class="mh-tools">
    <div class="seg langsel" role="group"><button type="button" aria-pressed="false">EN</button><button type="button" aria-pressed="true">ES</button></div>
    <button type="button" class="text-btn mh-link">Compartir</button>
    <a class="mh-sister" id="sister" href="https://betorzdev.github.io/pharloom-calculator/" target="_blank" rel="noopener" title="Calculadora de Telalejana: tu partida de Silksong">Silksong <span class="arr">↗</span></a>
  </div>
  <a class="brand" href="#"><img class="mh-hdr" src="assets/hall/tablet-hdr.png" alt="" width="862" height="111"><p class="title">Calculadora de Hallownest</p></a>
  <a class="mh-save" href="#"><span class="mh-save-fig"><span class="mh-save-light"></span><img src="assets/hud/knight.png" alt=""></span><span class="mh-save-lbl">Partida 4</span><span class="mh-save-short" aria-hidden="true">Partida 4</span></a>
</header><div class="mk-fake">(the screen bar and the page below)</div>
<svg class="fx" id="fx" aria-hidden="true"></svg>`;
const fx = document.getElementById('fx');
const sister = document.getElementById('sister');

/* ── The clock: one loop for every frame and tween ── */
const tasks = new Set();
const sched = q.has('tick') ? (f) => setTimeout(() => f(performance.now()), 16) : requestAnimationFrame;
(function loop(t) { for (const f of [...tasks]) f(t); sched(loop); })(performance.now());
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const lin = (p) => p, easeIn = (p) => p * p, easeOut = (p) => 1 - (1 - p) * (1 - p), easeInOut = (p) => p < 0.5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p);
function tween(ms, fn, ease = lin) {
  return new Promise((res) => {
    const t0 = performance.now();
    const f = (t) => { const p = Math.min(1, (t - t0) / ms); fn(ease(p)); if (p >= 1) { tasks.delete(f); res(); } };
    tasks.add(f); f(t0);
  });
}

/* ── Hornet ── */
const box = (el) => {
  const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect();
  return { l: r.left - s.left, t: r.top - s.top, r: r.right - s.left, b: r.bottom - s.top, w: r.width, h: r.height, cx: r.left - s.left + r.width / 2, cy: r.top - s.top + r.height / 2 };
};
const hx = {
  el: Object.assign(document.createElement('div'), { className: 'hx' }),
  x: 0, y: 0, dir: -1, name: '', i: 0, anim: null, done: null, state: 'arriving',
  /* Her pivot at (x, y); feet(x, f) puts her feet on the line f. */
  at(x, y) { this.x = x; this.y = y; this.place(); },
  feet(x, f) { this.at(x, f - FLOOR); },
  face(d) { this.dir = d; this.place(); },
  place() {
    const m = M[this.name]; if (!m) return;
    const s = this.el.style;
    s.transform = `translate(${this.x - m.px * K}px, ${this.y - m.py * K}px)` + (this.dir > 0 ? ' scaleX(-1)' : '');
    s.transformOrigin = `${m.px * K}px ${m.py * K}px`;
  },
  show(name, i) {
    const m = M[name];
    if (name !== this.name) {
      this.name = name;
      Object.assign(this.el.style, { width: m.w * K + 'px', height: m.h * K + 'px', backgroundImage: `url(assets/hornet/${name}.png)`, backgroundSize: `${m.w * K * m.n}px ${m.h * K}px` });
      this.place();
    }
    this.i = i; this.el.style.backgroundPosition = `${-i * m.w * K}px 0`;
  },
  /* A clip: resolves at its last frame (held), or at once for a loop, which runs until the next. */
  play(name, { loop = false, speed = 1, from = 0 } = {}) {
    if (this.anim) { tasks.delete(this.anim); this.anim = null; }
    if (this.done) { const d = this.done; this.done = null; d(); }
    const m = M[name];
    this.show(name, from);
    if (opt.still) return Promise.resolve();
    return new Promise((res) => {
      const t0 = performance.now();
      const f = (t) => {
        let i = from + Math.floor((t - t0) / 1000 * m.fps * speed);
        if (loop) { if (i >= m.n) i = m.loop + (i - m.n) % (m.n - m.loop); }
        else if (i >= m.n - 1) { i = m.n - 1; tasks.delete(f); this.anim = null; this.done = null; res(); }
        if (i !== this.i || name !== this.name) this.show(name, i);
      };
      this.anim = f; tasks.add(f);
      if (loop) res(); else this.done = res;
    });
  },
  idle() { this.state = 'idle'; return this.play('idle', { loop: true }); },
  /* Moves her pivot; null keeps that coordinate. */
  go(x, y, ms, ease = lin) {
    const x0 = this.x, y0 = this.y, x1 = x ?? x0, y1 = y ?? y0;
    return tween(ms, (p) => this.at(x0 + (x1 - x0) * p, y0 + (y1 - y0) * p), ease);
  },
  /* A jump: straight across, up by `lift` at the top of the arc. */
  arc(x, f, ms, lift) {
    const x0 = this.x, y0 = this.y, y1 = f - FLOOR;
    return tween(ms, (p) => this.at(x0 + (x - x0) * p, y0 + (y1 - y0) * p - lift * 4 * p * (1 - p)));
  },
};
stage.append(hx.el);
const RUN = 240 * K / 0.5, SPRINT = 460 * K / 0.5;   // px a second
/* Across the width she sprints, and runs the last stretch before stopping. */
const comeTo = async (x) => { const brake = x + 70 * K / 0.5; if (hx.x > brake) await runTo(brake, SPRINT, 'sprint'); await runTo(x); };
const runTo = async (x, speed = RUN, clip = 'run') => { hx.face(x > hx.x ? 1 : -1); hx.play(clip, { loop: true }); await hx.go(x, null, Math.abs(x - hx.x) / speed * 1000); };
const hand = () => ({ x: hx.x + hx.dir * 9 * K / 0.5, y: hx.y + 2 });

/* ── What she leaves ── */
const svg = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); fx.append(e); return e; };
function needle(x, y, ang) {
  const g = svg('g', {}); const L = 13 * K / 0.5;
  g.innerHTML = `<line class="needle" x1="0" y1="0" x2="${-L}" y2="0"/><circle class="needle-eye" cx="${-L - 2}" cy="0" r="1.8"/>`;
  g.set = (x, y, a) => g.setAttribute('transform', `translate(${x} ${y}) rotate(${a})`);
  g.set(x, y, ang); return g;
}
function dust(x, y, n = 12) {
  for (let i = 0; i < n; i++) {
    const d = Object.assign(document.createElement('span'), { className: 'dust' });
    d.style.left = x + 'px'; d.style.top = y + 'px'; stage.append(d);
    const a = Math.PI * (1 + Math.random()), r = 10 + Math.random() * 22;
    d.animate([{ transform: 'translate(-50%, -50%)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r * 0.6}px)) scale(0.4)`, opacity: 0 }],
      { duration: 500 + Math.random() * 400, easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)' }).onfinish = () => d.remove();
  }
}
function spark(x, y) {
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2, l = svg('line', { class: 'silk', x1: x, y1: y, x2: x, y2: y });
    tween(260, (p) => { l.setAttribute('x2', x + Math.cos(a) * 10 * p); l.setAttribute('y2', y + Math.sin(a) * 10 * p); l.style.opacity = 1 - p; }, easeOut).then(() => l.remove());
  }
}
function float(text, cls, x, y, rise = 26, ms = 1400) {
  const n = Object.assign(document.createElement('span'), { className: cls, textContent: text });
  n.style.left = x + 'px'; n.style.top = y + 'px'; stage.append(n);
  n.animate([{ transform: 'translate(-50%, 0) scale(0.8)', opacity: 0 }, { opacity: 1, offset: 0.2 }, { transform: `translate(-50%, ${-rise}px) scale(1)`, opacity: 0 }], { duration: ms, easing: 'ease-out' }).onfinish = () => n.remove();
}
const call = () => { sister.classList.remove('is-struck'); sister.classList.add('is-called'); };
const kneel = (el, kf, ms) => el.animate(kf, { duration: ms, easing: 'ease-out' });

/* ── Where she ends: standing on the link ── */
const spot = () => { const L = box(sister); return { x: L.cx, f: L.t + 1 }; };
const offRight = () => stage.clientWidth + 40;

/* ── The arrivals ── */
const ARRIVE = {
  async 0() {
    const s = spot(); hx.feet(offRight(), s.f);
    await comeTo(s.x + 10); await hx.play('skid'); call();
  },
  async 1() {
    const s = spot(), L = box(sister), fil = box(stage.querySelector('.mh-hdr'));
    hx.feet(offRight(), s.f);
    await comeTo(Math.min(stage.clientWidth - 50, fil.r + 40));
    await hx.play('skid');
    await hx.play('throw-antic');
    hx.play('throw');
    // The needle flies on its thread to the link's last letters, and sticks.
    const from = hand(), to = { x: L.r - 8, y: L.cy + 1 };
    const ang = Math.atan2(to.y - from.y, to.x - from.x) * 180 / Math.PI;
    const thread = svg('line', { class: 'silk', x1: from.x, y1: from.y, x2: from.x, y2: from.y });
    const n = needle(from.x, from.y, ang);
    await tween(260, (p) => { const x = from.x + (to.x - from.x) * p, y = from.y + (to.y - from.y) * p; n.set(x, y, ang); thread.setAttribute('x2', x); thread.setAttribute('y2', y); }, easeOut);
    sister.classList.add('is-struck'); spark(to.x, to.y);
    // Taut: a flick of the thread, then she's pulled along it.
    await tween(140, (p) => thread.setAttribute('y1', hand().y + Math.sin(p * Math.PI * 3) * 3 * (1 - p)));
    hx.play('pull');
    await tween(300, (p) => {
      hx.at(hx.x + (s.x + 6 - hx.x) * p, hx.y); const h = hand();
      thread.setAttribute('x1', h.x); thread.setAttribute('y1', h.y);
    }, easeIn);
    thread.remove(); n.remove();
    await hx.play('catch'); call(); dust(hx.x, s.f, 8);
    await hx.play('land', { from: 4 });
  },
  async 2() {
    const s = spot(), L = box(sister);
    hx.feet(offRight(), s.f);
    await comeTo(L.r + 24);
    // The dash over the word: behind her, the thread weaves through its letters.
    const x0 = L.r + 8, x1 = L.l - 6, mid = L.cy + 1, A = 5;
    const path = svg('path', { class: 'silk' });
    const weave = (xe, amp, m) => {
      let d = `M${x0},${m}`;
      for (let x = x0; x >= xe; x -= 2) d += ` L${x},${m + amp * Math.sin((x0 - x) / 7)}`;
      path.setAttribute('d', d);
    };
    hx.play('dash', { loop: true });
    await tween(520, (p) => { const x = L.r + 24 + (L.l - 18 - L.r - 24) * p; hx.at(x, hx.y); weave(Math.max(x1, x + 8), A, mid); }, easeOut);
    weave(x1, A, mid);
    await hx.play('skid');
    await hx.play('turn'); hx.face(1); hx.play('idle', { loop: true });
    // She looks: the thread cinches into an underline, and glints.
    await tween(380, (p) => weave(x1, A * (1 - p), mid + (L.b + 2 - mid) * p), easeInOut);
    path.classList.add('is-glint');
    sister.classList.add('is-struck');
    await wait(250);
    hx.play('jump');
    await hx.arc(s.x, s.f, 520, 34);
    hx.face(-1); dust(hx.x, s.f, 10); call();
    await hx.play('land', { from: 2 });
    tween(1200, (p) => { path.style.opacity = 0.85 - p * 0.45; });
  },
  async 3() {
    const s = spot(), kn = stage.querySelector('.mh-save-fig img'), Kb = box(kn), T = box(stage.querySelector('.title'));
    const fx0 = Kb.l - 24 * K / 0.5, floor = Kb.b - 3;
    hx.at(fx0, -60); hx.face(1);
    await hx.play('float-open');
    hx.play('float', { loop: true });
    await tween(1300, (p) => hx.at(fx0 + Math.sin(p * Math.PI * 2) * 6, -60 + (floor - FLOOR + 60) * p), easeOut);
    await hx.play('land', { from: 3 });
    hx.play('idle', { loop: true });
    kneel(kn, [{ transform: 'none' }, { transform: 'translateY(-5px)' }, { transform: 'none' }], 320);    // he startles
    await wait(450);
    const taunt = hx.play('taunt');
    await wait(330); float('Shaw!', 'shout', hx.x + 4, hx.y - 46 * K / 0.5);
    await wait(120); kneel(kn, [{ transform: 'none' }, { transform: 'translateX(3px) rotate(4deg)' }, { transform: 'translateX(-2px)' }, { transform: 'none' }], 420);
    await taunt;
    await hx.play('turn'); hx.face(-1);
    await runTo(hx.x - 30, SPRINT, 'sprint');
    hx.play('jump');
    await hx.arc(s.x, s.f, 900, Math.max(40, s.f - T.t + 30));
    dust(hx.x, s.f, 14); call();
    await hx.play('hardland', { from: 1, speed: 1.6 });
  },
  async 4() {
    const s = spot(), T = box(stage.querySelector('.title'));
    const x0 = T.l + T.w * 0.66, top = T.t + T.h * 0.2;
    hx.at(x0, -60); hx.face(-1);
    await hx.play('float-open');
    hx.play('float', { loop: true });
    await tween(2200, (p) => hx.at(x0 + Math.sin(p * Math.PI * 3) * 9 * (1 - p), -60 + (top - FLOOR + 60) * p), easeOut);
    dust(hx.x, top, 6);
    await hx.play('land', { from: 3 });
    await hx.play('look-up');
    hx.play('idle', { loop: true }); await wait(300);
    hx.play('jump');
    await hx.arc(s.x, s.f, 820, 46);
    dust(hx.x, s.f, 14); call();
    await hx.play('hardland', { from: 1, speed: 1.6 });
  },
};

/* ── While she waits ── */
const LIFE_NAMES = ['flourish', 'look', 'needolin', 'sit', 'taunt'];
const LIFE = [
  async () => { await hx.play('flourish'); },
  async () => { await hx.play('look-up'); await wait(700); },
  async () => {
    await hx.play('needolin-start'); hx.play('needolin', { loop: true });
    for (let i = 0; i < 5; i++) { float('♪', 'note', hx.x + hx.dir * 8 + (Math.random() * 10 - 5), hx.y - 20, 30, 1600); await wait(600); }
  },
  async () => { await hx.play('sit'); await wait(3500); },
  async () => { await hx.play('taunt-back'); },
];
let lifeTimer = 0;
function life() {
  clearTimeout(lifeTimer);
  if (!opt.life || opt.still) return;
  lifeTimer = setTimeout(async () => {
    if (hx.state !== 'idle') return life();
    hx.state = 'busy';
    await LIFE[Math.floor(Math.random() * LIFE.length)]();
    if (hx.state === 'busy') hx.idle();
    life();
  }, 4000 + Math.random() * 4000);
}

/* ── The mouse ── */
if (opt.hover) {
  stage.addEventListener('mousemove', (e) => {
    if (hx.state !== 'idle' && hx.state !== 'guard') return;
    const x = e.clientX - stage.getBoundingClientRect().left;
    if (Math.abs(x - hx.x) > 12) hx.face(x > hx.x ? 1 : -1);
  });
  sister.addEventListener('mouseenter', () => { if (hx.state !== 'idle' || opt.still) return; hx.state = 'guard'; hx.play('parry'); });
  sister.addEventListener('mouseleave', () => { if (hx.state === 'guard') hx.idle(); });
}

/* ── The click: she leaves; the link stays ── */
sister.addEventListener('click', async (e) => {
  e.preventDefault();
  if (hx.state === 'gone' || hx.state === 'arriving') return;
  hx.state = 'gone'; clearTimeout(lifeTimer);
  sister.classList.remove('is-called');
  if (opt.exit === 'none') return;
  if (opt.still) { hx.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }); return; }
  if (opt.exit === 'soar') {
    await hx.play('soar-antic');
    hx.play('soar-throw');
    const h = hand(), thread = svg('line', { class: 'silk', x1: hx.x, y1: hx.y - 20, x2: hx.x, y2: hx.y - 20 });
    await tween(140, (p) => thread.setAttribute('y2', (hx.y - 20) * (1 - p) - 20 * p), easeOut);
    hx.play('soar', { loop: true });
    await hx.go(null, -90, 380, easeIn);
    tween(400, (p) => { thread.style.opacity = 0.85 * (1 - p); }).then(() => thread.remove());
  } else if (opt.exit === 'leap') {
    hx.play('leap');
    await wait(260);
    await hx.arc(hx.x - 160 * hx.dir * -1, -40, 700, 70);
  } else {
    hx.face(-1); hx.play('backflip');
    await hx.arc(hx.x + 220, -60, 760, 60);
  }
  hx.el.remove();
});

/* ── Go ── */
(async () => {
  await document.fonts.ready;
  const s = spot();
  if (opt.end || opt.still) {
    hx.feet(s.x, s.f); hx.face(-1); call(); hx.idle(); life();
    if (q.has('do')) { hx.state = 'busy'; await LIFE[LIFE_NAMES.indexOf(q.get('do'))](); hx.idle(); }
    if (q.has('click')) { await wait(+q.get('click')); sister.click(); }
    return;
  }
  await wait(400);
  await ARRIVE[opt.a]();
  hx.idle(); life();
  // For screenshots: one move of her life at once (&do=needolin), or the click (&click=ms).
  if (q.has('do')) { hx.state = 'busy'; await LIFE[LIFE_NAMES.indexOf(q.get('do'))](); hx.idle(); }
  if (q.has('click')) { await wait(+q.get('click')); sister.click(); }
})();
</script>

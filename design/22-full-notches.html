<title>Full notches</title>
<!-- Design material, not part of the site. The Charms grid when your notches are full (1 Oct 2026):
   every charm you could not equip now is "blocked" (js/codec.js), and .qc.is-locked drops it to
   opacity 0.25; the ones you don't have add --missing-art on top. Measured with save 4 (6/6 notches
   used, the usual state of a real game): the missing ones at 8-20 of 255 over the black, the ones
   you have but don't wear about as dark. The game shows them as usual and only says "not enough
   notches" when you try. The grid below is the site's own markup, copied from save 4.
     Now · as it is.
     A · As the game: a charm that doesn't fit looks like any you don't wear; the one you don't have,
         in the one shadow (--missing-art) at full opacity. Not fitting is said where it's tried:
         the cursor (not-allowed), the title and the notice, as now.
     B · A softer step: the one that doesn't fit, a little dimmer than one that would (opacity .5);
         the one you don't have, in the one shadow, not dimmed again.
   Chosen on 1 Oct 2026: A (built: css/app.css .qc.is-locked; docs/guide.md). Measured after: the
   grid's median from 39 to 95 of 255; the missing ones at the --missing-art level.
   ?v=now|a|b. -->

<style>
body { background: var(--page-bg); background-attachment: fixed; margin: 0; }
.mk { max-width: 900px; margin: 0 auto; padding: var(--sp-6) var(--page-pad) var(--sp-16); }
.mk-h1 { font-family: var(--font-display); font-weight: 600; font-size: var(--fs-xl); letter-spacing: var(--track-title); color: var(--ink-strong); margin: 0 0 var(--sp-2); }
.mk-lead { max-width: var(--measure); color: var(--ink-2); font-size: var(--fs-sm); margin: 0 0 var(--sp-4); }
.mk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2) var(--sp-4); padding: var(--sp-2) 0; margin-bottom: var(--sp-6); border-bottom: 1px solid var(--line); font-size: var(--fs-sm); color: var(--muted); }
.mk-bar b { font-size: var(--fs-2xs); letter-spacing: var(--track-label); text-transform: uppercase; color: var(--label); font-weight: 600; }
.mk-bar button { background: none; border: 0; padding: var(--sp-1) 0; font: inherit; color: var(--muted); cursor: pointer; }
.mk-bar button[aria-pressed="true"] { color: var(--accent); box-shadow: inset 0 -1px 0 var(--accent-line); }
.mk-note { max-width: var(--measure); margin: 0 auto var(--sp-6); color: var(--ink-2); font-size: var(--fs-sm); text-align: center; min-height: 3em; }
.mk-stage { max-width: 720px; }
/* ════ The variants ════ */
/* A: not fitting doesn't dim; missing in the one shadow at full opacity. */
.v-a .qc.is-locked img { opacity: 0.7; filter: grayscale(0.3); }
.v-a .qc.is-locked.is-missing:not(.is-on) img { opacity: 1; filter: var(--missing-art); }
/* B: not fitting a little dimmer; missing not dimmed twice. */
.v-b .qc.is-locked img { opacity: 0.5; filter: grayscale(0.5); }
.v-b .qc.is-locked.is-missing:not(.is-on) img { opacity: 1; filter: var(--missing-art); }
</style>

<script>
'use strict';
const QUICK = document.getElementById('quick').innerHTML;
const q = new URLSearchParams(location.search);
const st = { v: q.get('v') || 'a' };
const V = {
  now: ['Now', 'As it is: what doesn\'t fit at 25%, and what you don\'t have darker still.'],
  a: ['A · As the game', 'A charm that doesn\'t fit looks like any you don\'t wear; one you don\'t have, in the one shadow. Not fitting is said when you try it: the cursor, its title and the notice.'],
  b: ['B · A softer step', 'What doesn\'t fit a little dimmer than what would; what you don\'t have in the one shadow, not dimmed twice.'],
};
function paint() {
  document.getElementById('bar').innerHTML = '<b>Variant</b>' + Object.entries(V).map(([v, [n]]) => `<button type="button" data-v="${v}" aria-pressed="${st.v === v}">${n}</button>`).join('');
  document.getElementById('note').textContent = V[st.v][1];
  const s = document.getElementById('stage'); s.className = 'mk-stage v-' + st.v; s.innerHTML = QUICK;
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) { st.v = b.dataset.v; paint(); } });
paint();
</script>

<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>smoke</title></head><body>
<pre id="out">…</pre>
<script src="js/data.js"></script>
<script src="js/codec.js"></script>
<script>
/* Smoke test: drives the site inside an iframe and checks the essentials.
   Read it with: google-chrome --headless --dump-dom .../debug-smoke.html
   Careful: headless mode has no "fine pointer", so the site behaves as touch:
   a tap on the grid equips or removes, and the detail alongside tells what changed. */
const log = [];
const errors = [];
const ok = (name, cond, extra) => log.push((cond ? 'OK   ' : 'FAIL ') + '  ' + name + (extra ? '  ' + extra : ''));
const show = () => {
  document.getElementById('out').textContent =
    log.concat(errors.length ? ['', 'ERRORS:'].concat(errors) : ['', 'no console errors']).join('\n');
};
try { localStorage.clear(); } catch (e) { /* nothing */ }
/* A test collection: everything found, but with Kingsoul instead of Void Heart, which is
   always equipped and would change the equipped count for almost everything below. */
try { localStorage.setItem('hollow.owned', JSON.stringify(HK.codec.OWN_MAX.map((x) => (x === 'voidheart' ? 'kingsoul' : x)))); } catch (e) { /* nothing */ }
const f = document.createElement('iframe');
f.style.cssText = 'width:1280px;height:900px;border:0';
f.src = 'index.html#v=1&nail=4&masks=9&notches=11&spells=222&arts=111&charms=ustrength,quickslash';
document.body.appendChild(f);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

f.addEventListener('load', async () => {
  const w = f.contentWindow, d = f.contentDocument;
  const q = (sel) => d.querySelector(sel);
  const txt = (sel) => (q(sel) ? q(sel).textContent.trim() : '(missing)');
  const click = async (sel) => { const n = q(sel); if (!n) { errors.push("can't find " + sel); return; } n.click(); await wait(40); };
  const equip = async (id) => { await click('#panel .quick-grid .qc[data-id="' + id + '"]'); };
  const onCount = () => d.querySelectorAll('#panel .quick-grid .qc.is-on').length;
  const onIds = () => [...d.querySelectorAll('#panel .quick-grid .qc.is-on')].map((n) => n.dataset.id).join(',');
  const isOn = (id) => !!q('#panel .quick-grid .qc.is-on[data-id="' + id + '"]');
  // The sheet's health and soul, figure only: "66/99" with soul spent, "99" full.
  const soulTxt = () => txt('#panel .rd-soul .v > span');
  const hpTxt = () => txt('#panel .rd-hp .v > span');
  w.addEventListener('error', (e) => errors.push('error in the site: ' + e.message));
  // Without focus, the clipboard fails and the site falls back to prompt(), which blocks the headless browser.
  // The link Share would have copied is noted down.
  let copied = '';
  w.prompt = (msg, url) => { copied = url || ''; return null; };
  try { Object.defineProperty(w.navigator, 'clipboard', { value: { writeText: (url) => { copied = url; return Promise.resolve(); } }, configurable: true }); } catch (e) { /* no clipboard */ }
  const goto = async (v) => { await click('#nav [data-act="view"][data-value="' + v + '"]'); await wait(40); };
  const visible = () => ['home', 'panel', 'gear', 'fight', 'hj', 'pg'].filter((id) => !q('#' + id).hidden).join(',');
  try {
    ok('loads the state from the URL', txt('.hero-num') === '32', 'hero=' + txt('.hero-num'));
    ok('in English by default', txt('.title') === 'Hallownest Calculator' && d.documentElement.lang === 'en', txt('.title'));
    ok('the selector puts English first', [...d.querySelectorAll('[data-act="lang"]')].map((n) => n.dataset.value).join(',') === 'en,es');
    ok('the screen labels follow the language', q('#home').getAttribute('aria-label') === 'Your game'
       && txt('#nav [data-value="home"] .nav-lbl') === 'Your game' && txt('#nav-tools') === 'Tools', q('#home').getAttribute('aria-label'));
    await click('[data-act="lang"][data-value="es"]');
    ok('title in Spanish', txt('.title').startsWith('Calculadora'));
    ok('Spanish goes into the URL', w.location.hash.includes('lang=es'), w.location.hash);
    ok('and so do the labels', q('#home').getAttribute('aria-label') === 'Partida'
       && txt('#nav [data-value="home"] .nav-lbl') === 'Partida' && txt('#nav-tools') === 'Herramientas', q('#home').getAttribute('aria-label'));
    ok('opens on Charms, with its tab marked and no "view=" in the URL', visible() === 'panel'
       && q('#nav [aria-current="page"]').dataset.value === 'charms' && w.location.hash.indexOf('view=') < 0, visible());
    ok('no top bar, floating button or collapsibles', !q('#topbar') && !q('#hj-fab') && !q('[data-act="gear"]') && !q('[data-act="fightOpen"]'));
    ok('40 slots in the grid, like the game, and not one of the old cards', d.querySelectorAll('#panel .quick-grid .qc').length === 40
       && !q('.charm-grid') && !q('#inspector'), d.querySelectorAll('#panel .quick-grid .qc').length + ' slots');
    ok('with nothing chosen, the detail explains how to use it', !!q('#charm-detail .detail-hint'), txt('#charm-detail'));
    // The page opens with Unbreakable Strength and Quick Slash: the detail adds them up (21 → 32 on the nail).
    ok('and, with charms of your own, what they add up to', !!q('#charm-detail .detail-sum li') && txt('#charm-detail .detail-sum').indexOf('32') >= 0, txt('#charm-detail'));
    ok('2 charms equipped', onCount() === 2, onIds());
    // Only the panel's charm notch row: the arena's spells also use the notch dot.
    const notches = () => [...d.querySelectorAll('#panel .notches .notch')].map((n) =>
      n.classList.contains('is-over') ? 'M' : n.classList.contains('is-free') ? '.' : 'O').join('');
    ok('the notch row shows the maximum', notches() === 'OOOOOO.....', notches());
    ok('the equipped charms show in the panel', d.querySelectorAll('.eq').length === 2);
    ok('marks the next slot', !!q('.eq-slot'));
    // Removing from the equipped ones removes directly, and the detail shows it; it's read-only, it carries no button.
    q('#panel .eq[data-id="quickslash"]').focus();
    await click('#panel .eq[data-id="quickslash"]');
    ok('removing from the equipped ones removes directly', onIds() === 'ustrength', onIds());
    ok('and the detail shows it, with no equip or remove button', txt('#charm-detail .insp-name') === 'Corte rápido'
       && !q('#charm-detail button:not([data-act="detailMore"])'), txt('#charm-detail .insp-name'));
    ok('focus stays on its grid slot', d.activeElement.matches('.quick-grid .qc[data-id="quickslash"]'),
       d.activeElement.className);
    await click('#panel .qc[data-id="quickslash"]');
    ok('and the grid puts it back', onCount() === 2 && onIds().includes('quickslash'), onIds());
    ok("focus doesn't jump to Equipped when equipping", d.activeElement.matches('.quick-grid .qc[data-id="quickslash"]'),
       d.activeElement.className);
    ok("the detail's slot looks chosen", q('#panel .qc[data-id="quickslash"]').classList.contains('is-sel')
       && d.querySelectorAll('#panel .qc.is-sel').length === 1);
    ok('game images in the panel', !!q('#panel .hero-nail') && d.querySelectorAll('#panel .plate img').length === 6);

    // The sheet carries the arena's HUD: the orb full (on the sheet it says how much soul fits) and
    // not a single reserve vessel, since this build has none: the ones you don't have aren't painted.
    ok('the soul orb is drawn', !!q('#panel .hud-soul') && q('#panel .hud-orb').style.getPropertyValue('--cut') === '0.0%',
       q('#panel .hud-orb') ? q('#panel .hud-orb').getAttribute('style') : 'no orb');
    ok('with no reserve vessels none is drawn', !q('#panel .hud-vessel') && !q('#panel .hud-vessels'));
    ok("the sheet isn't a scene: only the arena carries .kscene", !q('#panel .kscene'));
    // The sheet's soul is spent by hand, only to see it: each tap on the orb casts a spell
    // (33) and, when there's not enough for another, the next one fills it. No figure changes.
    const cutOrb = () => q('#panel .hud-orb').style.getPropertyValue('--cut');
    await click('#panel [data-act="soulOrb"]');
    ok('the orb empties by one spell', cutOrb() !== '0.0%' && soulTxt() === '66/99', cutOrb() + ' · ' + soulTxt());
    ok("spending soul doesn't change any figure", txt('.hero-num') === '32' && !q('#panel .is-flash'));
    await click('#panel [data-act="soulOrb"]');
    await click('#panel [data-act="soulOrb"]');
    ok('it can be left empty', cutOrb() === '100%' || cutOrb() === '100.0%', cutOrb());
    await click('#panel [data-act="soulOrb"]');
    ok('empty, the next tap fills it', cutOrb() === '0.0%' && soulTxt() === '99', cutOrb() + ' · ' + soulTxt());

    await click('[data-act="detail"]');
    ok('the full sheet opens', d.querySelectorAll('.stat').length > 45, d.querySelectorAll('.stat').length + ' rows');
    ok('there are several groups', d.querySelectorAll('.group').length >= 6, d.querySelectorAll('.group').length + ' grupos');
    // It opens below its button, which then closes it from the top; and an identical one closes it from the end.
    const toggles = () => [...d.querySelectorAll('#panel [data-act="detail"]')];
    ok('it closes from the top: its button stays above the sheet', toggles().length === 2
       && toggles()[0].compareDocumentPosition(q('#panel .detail')) === 4 && toggles()[0].getAttribute('aria-expanded') === 'true'
       && txt('#panel [data-act="detail"][data-value="top"]') === 'Ocultar el detalle', txt('#panel [data-act="detail"][data-value="top"]'));
    ok('and from the bottom, with another one at the end', q('#panel .detail').compareDocumentPosition(toggles()[1]) === 4);
    await click('#panel [data-act="detail"][data-value="bottom"]');
    ok('closed from the bottom, focus goes back to the button that remains', !q('#panel .detail') && toggles().length === 1
       && d.activeElement === toggles()[0] && txt('#panel [data-act="detail"]') === 'Ver todas las estadísticas', txt('#panel [data-act="detail"]'));
    await click('#panel [data-act="detail"][data-value="top"]');
    d.activeElement.blur();

    // Hiveblood changes the picture of the HUD's masks: the game's honey hexagon.
    const hiveMasks = () => d.querySelectorAll('#panel .hud-mask img.is-hive').length;
    ok('without Hiveblood, the usual masks', hiveMasks() === 0);
    await equip('hiveblood');
    ok('with Hiveblood, all in the honey hexagon, in the mini-bar too',
       hiveMasks() === d.querySelectorAll('#panel .hud-mask:not(.lb)').length && hiveMasks() > 0
       && /hiveblood/i.test(q('#minihud .mini-mask').getAttribute('src')), hiveMasks() + ' hexagons');
    await equip('hiveblood');
    ok('and on removing it they come back', hiveMasks() === 0);

    await equip('fury');
    ok('the detail tells what changed', txt('#charm-detail .insp-name') === 'Furia de los caídos'
       && d.querySelectorAll('#charm-detail .insp-list li').length > 0, txt('#charm-detail .insp-name'));
    ok('equipping Fury adds a charm', onCount() === 3, onIds());
    ok("its cost, with the game's notch points", d.querySelectorAll('#charm-detail .detail-cost .notch').length === 2);
    ok('the figures go above the charm band', q('#panel .inv-status').compareDocumentPosition(q('#panel .inv-band')) === 4
       && !!q('#panel .inv-status .metric[data-id="nail.dps"]'));
    ok('health and soul, as figures only', !q('#panel .rd .n') && hpTxt() === '9' && soulTxt() === '99', hpTxt() + ' · ' + soulTxt());
    ok('the mini-bar carries the DPS', txt('#minihud .mini-lbl') === 'DPS');
    /* The detail is always the same size and nothing spills out of it, with all 45 charms, on desktop
       and on mobile. Focusing a slot puts it in the detail without equipping it. */
    const measureDetail = () => {
      const heights = new Set(), clipped = [], bandHeights = new Set();
      for (const tile of d.querySelectorAll('#panel .quick-grid .qc')) {
        tile.focus();
        const box = q('#charm-detail');
        heights.add(Math.round(box.getBoundingClientRect().height));
        bandHeights.add(Math.round(q('#panel .inv-band').getBoundingClientRect().height));
        if (box.scrollHeight > box.clientHeight + 1) clipped.push(tile.dataset.id);
      }
      d.activeElement.blur();
      return { heights: [...heights].join(','), bandHeights: [...bandHeights].join(','), clipped: clipped.join(',') };
    };
    const wide = measureDetail();
    ok('the detail is the same size with all 45 and none is clipped', wide.heights.split(',').length === 1 && !wide.clipped,
       'altos ' + wide.heights + ' · cortados: ' + (wide.clipped || 'ninguno'));
    ok("and the band doesn't change height", wide.bandHeights.split(',').length === 1, 'banda ' + wide.bandHeights);
    f.style.width = '390px';
    await wait(80);
    const mobile = measureDetail();
    // On mobile there's no mouse to make it jump: it's as tall as what it says, with no fixed space, and nothing is clipped.
    ok('on mobile, at its size and clipping nothing', !mobile.clipped,
       'altos ' + mobile.heights + ' · cortados: ' + (mobile.clipped || 'ninguno'));
    const widthOf = (sel) => Math.round(q(sel).getBoundingClientRect().width);
    ok('and on mobile the grid and the detail take the full width', widthOf('#panel .quick-grid') > 300 && widthOf('#charm-detail') > 300
       && q('#panel .loadout-block.is-notches').getBoundingClientRect().top < q('#panel .quick').getBoundingClientRect().top,
       'rejilla ' + widthOf('#panel .quick-grid') + ' · detalle ' + widthOf('#charm-detail'));
    f.style.width = '1280px';
    await wait(80);
    q('#panel .qc[data-id="joni"]').focus();
    ok("Joni's Blessing, with more than six changes, keeps five and points to the full sheet", d.querySelectorAll('#charm-detail .insp-list li:not(.insp-more)').length === 5
       && /^y \d+ más en la ficha completa$/.test(txt('#charm-detail .insp-more')), txt('#charm-detail .insp-more'));
    const remaining = Number(txt('#charm-detail .insp-more').split(' ')[1]);
    await click('#charm-detail [data-act="detailMore"]');
    ok('and "and N more" opens the full sheet with its rows highlighted', !!q('#panel .detail') && d.querySelectorAll('#panel .stat.is-hit').length >= 5 + remaining - 2,
       d.querySelectorAll('#panel .stat.is-hit').length + ' rows');
    await click('[data-act="detail"]');
    d.activeElement.blur();
    ok("there's no longer a log of the last change", !q('.last'));
    // Effects: what charms do that doesn't show in the figures, as plates below the band.
    const effVals = () => [...d.querySelectorAll('#panel .eff-plates .plate-val')].map((n) => n.textContent.trim());
    ok('Fury shows its damage at 1 mask in Effects', effVals().includes('56'), effVals().join(' · '));
    await click('#panel [data-act="quick"][data-id="thorns"]');
    ok('equipping Thorns of Agony adds its plate with the base damage', txt('#panel .eff-plates [data-id="nail.thorns"] .plate-val') === '21', txt('#panel .eff-plates [data-id="nail.thorns"] .plate-val'));
    await click('#panel [data-act="quick"][data-id="thorns"]');
    ok('and removing it removes it', !q('#panel .eff-plates [data-id="nail.thorns"]'));

    await click('[data-act="hp"][data-value="1"]');
    ok('at 1 mask Fury fires', txt('.hero-num') === '56', 'hero=' + txt('.hero-num'));
    // Only what just changed flashes, and once: collapsing or expanding something doesn't repeat it.
    ok('what changed flashes', !!q('#panel .hero.is-flash') && !q('#panel .plate.is-flash[data-id="spell.vs"]'),
       [...d.querySelectorAll('#panel .is-flash')].map((n) => n.dataset.id || n.className).join(' · '));
    ok('health shows the health left over the maximum', hpTxt() === '1/9', hpTxt());
    ok('only one full mask left', d.querySelectorAll('#panel .pip-mask:not(.is-empty)').length === 1);
    await click('[data-act="hp"][data-value="0"]');
    ok('the last mask takes you back to full health', !q('#panel .pip-mask.is-empty') && txt('.hero-num') === '32',
       hpTxt() + ' · hero=' + txt('.hero-num'));
    await click('[data-act="detail"]');
    ok("collapsing the full sheet doesn't repeat the flash", !q('#panel .is-flash'));
    await click('[data-act="detail"]');

    await click('[data-act="lang"][data-value="en"]');
    ok('switches to English', txt('.title') === 'Hallownest Calculator', txt('.title'));
    ok("English, being the default, doesn't go into the URL", !w.location.hash.includes('lang='), w.location.hash);
    ok('the engine translates', txt('.hero .lbl') === 'Nail damage', txt('.hero .lbl'));
    const rows = [...d.querySelectorAll('.stat-label')].map((n) => n.textContent);
    const esRows = rows.filter((r) => /máscar|aguij|alma|hechiz|curaci|saviavida/i.test(r));
    ok('no stray Spanish on the sheet', esRows.length === 0, esRows.slice(0, 3).join(' | '));
    const chips = [...d.querySelectorAll('.chip')].map((n) => n.textContent);
    const esChips = chips.filter((c) => /Fuerza|Corte|aguijón|máscara|alma/i.test(c));
    ok('no Spanish in the contributions', esChips.length === 0, esChips.slice(0, 3).join(' | '));
    ok('decimals in English', !/\d,\d/.test(txt('.metric .val')), txt('.metric .val'));

    await click('[data-act="lang"][data-value="es"]');
    ok('back to Spanish', txt('.title').startsWith('Calculadora'));

    await click('[data-act="preset"][data-value="base"]');
    ok('base preset', txt('.hero-num') === '5', 'hero=' + txt('.hero-num'));
    ok('with no charms there is no Effects block', !q('#panel .inv-effects'));
    ok('with nothing learnt, the six plates as silhouettes', d.querySelectorAll('#panel .plate').length === 6 && !q('#panel .plate.is-on'));
    // The base Knight is a new game: no charms found, and the ones you don't have
    // can be looked at but not equipped. They're all marked on the Inventory to keep testing.
    ok('the base Knight has no charms found', d.querySelectorAll('#gear .quick-owned .qc.is-missing').length === 40);
    await click('#panel .qc[data-id="fheart"]');
    ok("one not found can't be equipped", !isOn('fheart') && txt('#charm-detail .insp-state').indexOf('Sin conseguir') >= 0, txt('#charm-detail .insp-state'));
    // It can be marked found right there, in the detail, and then the grid equips it.
    ok('the detail offers to mark it found, with a real button', txt('#charm-detail [data-act="ownHere"]') === 'Marcar como conseguido' && q('#charm-detail [data-act="ownHere"]').classList.contains('btn'), txt('#charm-detail .insp-state'));
    await click('#charm-detail [data-act="ownHere"]');
    ok('and marks it found without leaving Charms', visible() === 'panel' && !q('#panel .qc[data-id="fheart"].is-missing')
       && !q('#charm-detail [data-act="ownHere"]') && txt('#charm-detail .insp-name') === 'Corazón frágil', txt('#charm-detail .insp-name'));
    await click('#gear [data-act="ownAll"][data-value="1"]');
    // All is the end of the game: from each double slot, one version, and the slot shows it lit.
    ok('All marks them found', !q('#gear .quick-owned .qc.is-missing')
       && d.querySelectorAll('#gear .quick-owned .qc-dual .qc-pip.is-on').length === 5);
    // All is the end of the game, with Void Heart, which is always equipped and can't be removed.
    ok('with Void Heart, equipped by itself', isOn('voidheart'), onIds());
    await equip('voidheart');
    ok("and it can't be removed", isOn('voidheart') && txt('#charm-detail .insp-state').indexOf('No se puede quitar') >= 0, txt('#charm-detail .insp-state'));
    await click('[data-act="clear"]'); await wait(1000);   // the charms leave one by one first
    ok('not even with Clear', isOn('voidheart'), onIds());
    // The double slots: one whole slot on the Inventory that switches none → first → second → none.
    ok('Inventory: five whole double slots', d.querySelectorAll('#gear .quick-owned .qc-dual').length === 5 && !q('#gear .qslot-pair'));
    ok('on Charms, the version you have shows alone', !q('#panel .qslot-pair') && !!q('#panel .qc[data-id="uheart"]') && !q('#panel .qc[data-id="fheart"]'));
    await click('#gear .quick-owned .qc-dual[data-value="king"]');
    ok('without it in the collection, it is removed', !isOn('voidheart'), onIds());
    ok('with no version, the two halves shadowed', d.querySelectorAll('#panel .qslot-pair .qc.is-missing').length === 2);
    ok('with none, the slot shadowed and both dots empty', !!q('#gear .qc-dual.is-missing[data-value="king"][data-token="kingsoul"]')
       && !q('#gear .qc-dual[data-value="king"] .qc-pip.is-on'));
    await click('#gear .quick-owned .qc-dual[data-value="king"]');
    ok('marking one version leaves it alone on Charms', !!q('#panel .qc[data-id="kingsoul"]:not(.is-missing)') && !q('#panel .qslot-pair'));
    await click('#gear .quick-owned .qc-dual[data-value="heart"]');
    await click('#gear .quick-owned .qc-dual[data-value="heart"]');
    ok('switching to the other version removes the previous one', !!q('#gear .quick-owned .qc-dual[data-value="heart"][data-token="uheart"]') && !q('#panel .qc[data-id="uheart"]'));
    await equip('fheart');
    ok('Fragile Heart equipped', isOn('fheart'), onIds());
    await click('#gear .quick-owned .qc-dual[data-value="heart"]');
    ok('on swapping it for the unbreakable one, the fragile one is removed', !isOn('fheart'), onIds());
    await equip('uheart');
    ok('Divine makes it unbreakable', onCount() === 1 && isOn('uheart'), onIds());

    // With 3 notches and Unbreakable Heart equipped (2), Joni's Blessing (4) overcharms but goes in.
    await equip('joni');
    ok('overcharm allowed with one free notch', onCount() === 2 && !!q('.banner'), onIds() + ' · notice: ' + (q('.banner') ? 'yes' : 'no'));
    ok("overcharmed: nothing more can be equipped", q('#panel .qc[data-id="swarm"]').classList.contains('is-locked'));
    ok('the overcharm notice goes in the band, below the notches', !!q('#panel .inv-band .banner.is-band'));
    // The notches and the notice grow, but the grid stays attached to Equipped.
    const gap = () => Math.round(q('#panel .quick').getBoundingClientRect().top - q('#panel .loadout-block.is-eq').getBoundingClientRect().bottom);
    ok("and it doesn't separate Equipped from the grid", gap() <= 24 && q('#panel .loadout-block.is-notches').getBoundingClientRect().height
       > q('#panel .loadout-block.is-eq').getBoundingClientRect().height, gap() + ' px');
    await equip('swarm');
    ok("tapping a locked one doesn't equip and the detail says why", !isOn('swarm') && txt('#charm-detail .insp-name') === 'Enjambre recolector'
       && !!q('#charm-detail .insp-state.bad') && !q('#charm-detail [data-act="equip"]'), txt('#charm-detail .insp-state'));

    // The row grows beyond the maximum and the charm that takes you over comes out in magenta:
    // 3 notches, Unbreakable Heart (2) + Joni's Blessing (4) = OO + MMMM.
    ok("the notches of the one that overcharms you come out in magenta", notches() === 'OOMMMM', notches());
    ok('no free slot marked when overcharming', !q('.eq-slot'));

    // The game's flash and shake, only when crossing the threshold.
    const fx = d.getElementById('overcharm-fx');
    ok('the overcharm flash fires', !fx.hidden && fx.classList.contains('is-on'));
    ok('the page shakes', q('.page').classList.contains('is-quaking'));
    ok('marks the state while it lasts', d.documentElement.classList.contains('is-overcharming'));
    ok('the edges are tinted purple with the flash', w.getComputedStyle(q('.page'), '::after').animationName === 'overcharm-ambient');
    await click('[data-act="hp"][data-value="1"]');
    await wait(2800);
    ok('the effect cleans itself up', fx.hidden && !fx.classList.contains('is-on') &&
       !q('.page').classList.contains('is-quaking') && !d.documentElement.classList.contains('is-overcharming'));
    ok("and the purple of the edges doesn't stay even if you remain overcharmed", !!q('.banner') && w.getComputedStyle(q('.page'), '::after').opacity === '0',
       w.getComputedStyle(q('.page'), '::after').opacity);
    await click('[data-act="hp"][data-value="0"]');
    ok("it doesn't repeat if you were already overcharmed", !fx.classList.contains('is-on'));
    // By data-id and not by position: the panel can reorder its metrics.
    ok("Joni's Blessing cancels healing", txt('.metric[data-id="heal.timePerMask"] .val').indexOf('—') >= 0, txt('.metric[data-id="heal.timePerMask"] .val'));

    await click('[data-act="share"]');
    ok('the link saves the build', w.location.hash.indexOf('joni') >= 0, w.location.hash);
    ok('and Share copies it', copied.indexOf('joni') >= 0 && copied.indexOf('#') > 0, copied);

    ok('with Shift the range from the last one is picked', txt('#hj-bulk-scope') === 'En las 7 seleccionadas', txt('#hj-bulk-scope'));
    await click('[data-act="hjPickNone"]');
    q('.hj-row[data-id="vengefly"]').dispatchEvent(new w.KeyboardEvent('keydown', { key: ' ', bubbles: true }));
    await wait(40);
    ok('from the keyboard, Space on the row being read picks it', q('.hj-pick[data-id="vengefly"]').getAttribute('aria-checked') === 'true'
       && hjCur() === 'vengefly', txt('#hj-bulk-scope'));
    await click('[data-act="hjBulk"]');
    ok('collapsing removes the checkboxes and drops the selection', !q('.hj-pick') && !q('.hj-row.is-picked'));
    ok("your game's Journal doesn't touch the combat one", !q('.journal .hj-row') && !q('#hj .jr-row'));
    w.history.back();
    await wait(200);
    ok('Back returns to the previous screen', visible() === 'fight' && w.location.hash.indexOf('view=fight') >= 0, visible() + ' · ' + w.location.hash);

    /* ── Pantheons: the Master's from end to end ────────────────────────── */
    w.location.hash = '#v=1&nail=4&masks=9&vessels=3&notches=11&spells=222&arts=111&charms=ustrength,quickslash&view=godhome';
    await wait(140);
    await click('[data-act="fightTab"][data-value="pantheon"]');
    ok('the Pantheons tab shows all five', d.querySelectorAll('.pcard').length === 5, d.querySelectorAll('.pcard').length + ' panteones');
    ok('and the four bindings', d.querySelectorAll('[data-act="bindToggle"]').length === 4);
    // The fourth binding lights all four in gold, with the overcharm hit in that gold.
    for (const k of ['nail', 'shell', 'charms']) await click(`[data-act="bindToggle"][data-value="${k}"]`);
    ok('with three, neither gold nor hit', !q('.binds.is-all') && !d.documentElement.classList.contains('is-binding-all'));
    await click('[data-act="bindToggle"][data-value="soul"]');
    ok('the fourth puts them in gold, flashes in gold and shakes', !!q('.binds.is-all') && d.documentElement.classList.contains('is-binding-all')
       && q('#overcharm-fx').classList.contains('is-gold') && q('.page').classList.contains('is-quaking'));
    ok("and it isn't the overcharm", !d.documentElement.classList.contains('is-overcharming'));
    for (const k of ['nail', 'shell', 'charms', 'soul']) await click(`[data-act="bindToggle"][data-value="${k}"]`);
    await wait(1400);
    ok('the hit goes away by itself', !d.documentElement.classList.contains('is-binding-all') && q('#overcharm-fx').hidden);
    await click('[data-act="pantheonPick"][data-value="master"]');
    ok('Enter comes with what you are entering', txt('.run-go .run-sum b') === 'Panteón del Maestro' && !!q('.run-go [data-act="runStart"]'), txt('.run-go .run-sum'));
    await click('[data-act="runStart"]');
    const tiles = () => [...d.querySelectorAll('.timeline .tl')];
    const states = () => tiles().map((x) => (x.classList.contains('is-done') ? '✔' : x.classList.contains('is-current') ? '▶'
      : x.classList.contains('is-fail') ? '✖' : '·')).join('');
    ok('the timeline has the 12 rooms and marks the first', tiles().length === 12 && states() === '▶···········', states());
    // The names, against the data: they're being switched to the official Spanish ones.
    const nameEs = (id) => w.HK.foes.FOE_BY_ID[id].name.es;
    ok('room 1 is the Vengefly King', txt('.foes-head h3') === nameEs('vengefly-king') && txt('.run-head .run-stat') === 'Sala 1 de 12',
       txt('.foes-head h3') + ' · ' + txt('.run-head .run-stat'));
    ok('the run gets saved', JSON.parse(w.localStorage.getItem('hollow.run') || '{}').room === 0);

    // Hit without waiting: each click repaints synchronously.
    const winRoom = () => { let n = 0; while (!q('.room-done') && q('[data-act="hit"][data-id="nail"]') && n++ < 600) q('[data-act="hit"][data-id="nail"]').click(); };
    const maskCount = () => Number(txt('.side-knight .kside-masks'));
    winRoom();
    ok('winning the room offers the next one', !!q('.room-done [data-act="runNext"]'));
    await click('[data-act="runNext"]');
    ok('room 1 ends up cleared and room 2 is the current one', states().startsWith('✔▶'), states());

    // Take a hit in room 2: the lost mask carries over to room 3.
    const before = maskCount();
    await click('.move-foe');
    winRoom();
    await click('[data-act="runNext"]');
    ok('health carries from one room to the next', maskCount() === before - 1, before + ' → ' + maskCount());

    /* ── Halfway through the pantheon, charms can't be touched from anywhere ── */
    const equippedIds = () => onIds();
    const lockedIds = equippedIds();
    const bannerText = () => txt('#banner .banner.is-run:not(.is-hint) .banner-text');
    ok("on the pantheon tab the notice that you're in it doesn't show", !q('#banner .banner.is-run:not(.is-hint)'));
    await goto('charms');
    ok("outside the bench the notice that you're in a pantheon shows", bannerText().indexOf('Panteón del Maestro · sala 3 de 12') === 0, bannerText());
    ok('and the grid looks locked', q('#panel .quick').classList.contains('is-locked'));
    await click('#panel .qc[data-id="longnail"]');
    ok("the panel doesn't equip", equippedIds() === lockedIds && !q('#panel .qc.is-on[data-id="longnail"]'), equippedIds());
    ok('and says so when you try', !q('#toast').hidden && txt('#toast').indexOf('Estás en el Panteón del Maestro') === 0, txt('#toast'));
    await click('#panel .eq[data-id="quickslash"]');
    ok('nor removes from the equipped ones', equippedIds() === lockedIds, equippedIds());
    await click('#panel .qc[data-id="longnail"]');
    ok('the detail shows the charm, but without an equip button', !q('[data-act="equip"][data-id="longnail"]')
       && txt('#charm-detail .insp-state.cond').indexOf('bancos') >= 0, txt('#charm-detail .insp-state.cond'));
    ok('nor can they all be removed', q('[data-act="clear"]').disabled);
    await click('[data-act="setv"][data-key="notches"][data-value="10"]');
    ok('nor can the notches be changed', w.location.hash.indexOf('notches=11') >= 0, w.location.hash);
    await click('[data-act="preset"][data-value="base"]');
    ok('nor a preset that removes them', equippedIds() === lockedIds, equippedIds());
    w.location.hash = '#v=1&nail=4&masks=9&vessels=3&notches=11&spells=222&arts=111&charms=longnail';
    await wait(140);
    ok("nor a link: the pantheon's stay", equippedIds() === lockedIds && w.location.hash.indexOf('longnail') < 0
       && txt('#toast').indexOf('enlace') >= 0, w.location.hash);
    await goto('godhome'); await click('[data-act="fightTab"][data-value="hall"]');
    ok('nor from the Hall of Gods', !!q('#banner .banner.is-run:not(.is-hint)') && q('#panel .quick').classList.contains('is-locked'));
    await goto('fight');
    ok('nor from the Combat tab', !!q('#banner .banner.is-run:not(.is-hint)') && q('#panel .quick').classList.contains('is-locked'));
    await click('[data-act="runLockGo"]');
    ok('"Go to the pantheon" goes back to the room', visible() === 'fight' && w.location.hash.indexOf('view=godhome') >= 0
       && d.activeElement.matches('#fight .screen-title')
       && q('[data-act="fightTab"][data-value="pantheon"]').getAttribute('aria-selected') === 'true'
       && txt('.run-head .run-stat') === 'Sala 3 de 12', txt('.run-head .run-stat'));
    for (let i = 0; i < 3; i++) { winRoom(); await click('[data-act="runNext"]'); }

    /* ── The rest: you choose ───────────────────────────────────────────── */
    ok('room 6 is a rest', !!q('.rest-stations') && states().startsWith('✔✔✔✔✔▶'), states());
    ok('each station brings its corner of the room', [...d.querySelectorAll('.rest-station .rs-art img')]
       .map((i) => i.getAttribute('src').split('/').pop()).join(' ') === 'rest-spring.png rest-bench.png rest-cocoon.png');
    ok('at the rest the notice goes and everything unlocks', !q('#banner .banner.is-run:not(.is-hint)')
       && !q('#panel .quick').classList.contains('is-locked'));
    // The charm grid is at the rest, but locked until you sit down.
    const restGrid = () => [...d.querySelectorAll('.rest-charms .qc')];
    ok('the rest brings the charm grid', restGrid().length === 40, restGrid().length + ' slots');
    ok('and it can be used', restGrid().every((b) => !b.disabled), txt('.rest-charms .quick-hint'));
    ok('with no bindings completed there is no cocoon', q('[data-act="restCocoon"]').disabled);
    await click('[data-act="restSit"]');
    ok('sitting down gives full health back', maskCount() === 9, maskCount() + ' masks');
    // A single charm selection across the whole site, both ways.
    await click('.rest-charms .qc[data-id="longnail"]');
    ok('equipping at the bench equips it on the sheet', isOn('longnail'));
    ok('and on the panel and in the link', !!q('#panel .qc.is-on[data-id="longnail"]') && w.location.hash.indexOf('longnail') >= 0,
       w.location.hash);
    await click('#panel .qc[data-id="longnail"]');
    ok('removing it outside the bench removes it from the bench', !q('.rest-charms .qc.is-on[data-id="longnail"]')
       && !q('.rest-charms .eq[data-id="longnail"]'));
    // Seated, putting on a Lifeblood Heart leaves you at the new full health: 9 + 2.
    await click('.rest-charms .qc[data-id="uheart"]');
    ok('seated, a Lifeblood Heart arrives with its masks full', maskCount() === 11, maskCount() + ' masks');
    await click('.rest-charms .qc[data-id="uheart"]');
    await click('[data-act="restBath"]');
    ok('the hot springs fill soul', txt('.side-knight .kside-read').indexOf('198/198') >= 0, txt('.side-knight .kside-read'));
    ok('and afterwards they have nothing left to give', txt('[data-act="restBath"] .rs-fxs') === 'ya estás al máximo', txt('[data-act="restBath"] .rs-fxs'));
    await click('[data-act="runNext"]');
    ok('on leaving the rest they lock again', q('#panel .quick').classList.contains('is-locked'));
    await goto('home');
    ok("and on Your game the notice that you're in a pantheon shows", !!q('#banner .banner.is-run:not(.is-hint)'), bannerText());
    ok('with its button to abandon it without going there', txt('#banner [data-act="runQuit"]') === 'Abandonar');
    await goto('godhome');
    for (let i = 0; i < 4; i++) { winRoom(); await click('[data-act="runNext"]'); }
    ok('room 11 is the Godseeker', txt('.side-foes .foecard-name') === 'Buscador de Dioses', txt('.side-foes .foecard-name'));
    await click('[data-act="runNext"]');
    ok('and room 12 is Oro and Mato', txt('.foes-head h3') === nameEs('oro-mato'), txt('.foes-head h3'));
    let rounds = 0;
    while (!q('.run-end') && rounds++ < 30) { winRoom(); if (q('[data-act="runNext"]')) q('[data-act="runNext"]').click(); }
    ok('the Pantheon of the Master is completed', !!q('.run-end.is-won') && states() === '✔✔✔✔✔✔✔✔✔✔✔✔', txt('.run-end .fight-end-title') + ' · ' + states());
    ok('and at the end they unlock', !q('#banner .banner.is-run:not(.is-hint)') && !q('#panel .quick').classList.contains('is-locked'));

    /* ── Falling ends the attempt ────────────────────────────────────────── */
    await click('[data-act="runAgain"]');
    let hits = 0;
    while (!q('.run-end') && hits++ < 30) await click('.move-foe');
    ok('falling ends the attempt and says where', !!q('.run-end.is-dead') && txt('.run-end .fight-end-note').indexOf('sala 1 de 12') >= 0
       && states().startsWith('✖'), txt('.run-end .fight-end-note'));

    /* ── Cocoon, bench and the order ────────────────────────────────────── */
    await click('[data-act="runQuit"]');
    // The cocoon comes from your game: the lifeblood door opens with 8 completed bindings and
    // then every bench carries one. Two pantheons with all four at once make 8.
    await click('[data-act="doorBind"][data-value="master:all"]');
    ok('with 4 bindings the door stays shut and there is no cocoon', /4 de 20/.test(txt('.door-state')) && !q('.door-cocoon')
       && d.querySelectorAll('.door-notches .dn.is-lit').length === 4 && !!q('.pdone.is-all'), txt('.door-state'));
    await click('[data-act="doorBind"][data-value="artist:all"]');
    ok('with 8 it opens and the cocoon gives 3 germs, with no further steps', d.querySelectorAll('.door-seeds img').length === 3
       && /Con 12 vínculos, 4/.test(txt('.door-cocoon')), txt('.door-state') + ' · ' + txt('.door-cocoon'));
    ok('and it gets saved as your game', (JSON.parse(w.localStorage.getItem('hollow.bindings') || '{}').all || []).length === 2);
    await click('[data-act="doorBind"][data-value="artist:soul"]');
    ok('removing a binding closes the door and the cocoon goes', !q('.door-cocoon')
       && /7 de 20 vínculos y te falta 1 /.test(txt('.door-state')), txt('.door-state'));
    await click('[data-act="doorBind"][data-value="artist:soul"]');
    await click('[data-act="runStart"]');
    for (let i = 0; i < 5; i++) { winRoom(); await click('[data-act="runNext"]'); }
    const lifeblood = () => { const m = txt('.side-knight .kside-lb').match(/\d+/); return m ? Number(m[0]) : 0; };
    await click('[data-act="restCocoon"]');
    ok('breaking the cocoon gives 3 lifeblood', lifeblood() === 3, lifeblood());
    ok("and it can't be broken twice", q('[data-act="restCocoon"]').disabled);
    ok('the bench warns that it takes it away', /−3/.test(txt('[data-act="restSit"] .rs-fx.is-loss'))
       && !!q('[data-act="restSit"] .rs-fx.is-note'), txt('[data-act="restSit"] .rs-fxs'));
    await click('[data-act="restSit"]');
    ok('sitting down afterwards wipes it', lifeblood() === 0 && txt('.fight-log li').indexOf('pierdes 3') >= 0, txt('.fight-log li'));
    ok('but the bench puts the cocoon back', !q('[data-act="restCocoon"]').disabled);
    await click('[data-act="restCocoon"]');
    ok('and breaking it after sitting down does keep it', lifeblood() === 3, lifeblood());
    await click('[data-act="runNext"]');
    ok('lifeblood carries into the next fight', lifeblood() === 3 && txt('.foes-head h3') === nameEs('gorb'), lifeblood() + ' · ' + txt('.foes-head h3'));

    /* ── Abandoning from the notice, without going to the tab ──────────── */
    await goto('home');
    await click('#banner [data-act="runQuit"]');
    ok('abandoning from the notice ends it and says so', !q('#banner .banner.is-run:not(.is-hint)') && !w.localStorage.getItem('hollow.run')
       && !q('#panel .quick').classList.contains('is-locked') && txt('#toast') === 'Has abandonado el Panteón del Maestro'
       && d.activeElement === q('#home .screen-title'), txt('#toast') + ' · foco: ' + d.activeElement.className);
    await goto('godhome');
    ok('and the tab goes back to choosing a pantheon', d.querySelectorAll('.pcard').length === 5);

    /* ── Jumping straight to a room ─────────────────────────────────────── */
    await click('[data-act="doorBind"][data-value="master:nail"]');   // 7: door shut, no cocoon
    await click('[data-act="runStart"]');
    const states2 = () => tiles().map((x) => (x.classList.contains('is-done') ? '✔' : x.classList.contains('is-current') ? '▶'
      : x.classList.contains('is-skipped') ? '–' : '·')).join('');
    ok('each tile, except the current one, is a button', d.querySelectorAll('.timeline [data-act="runJump"]').length === 11);
    winRoom();
    await click('[data-act="runNext"]');
    await click('[data-act="runJump"][data-value="0"]');
    ok('going back to a cleared room marks it as the current one', states2().startsWith('▶·'), states2());
    await click('.move-foe');                                     // you arrive hurt wherever you skip to
    const hurtMasks = maskCount();
    await click('[data-act="runJump"][data-value="5"]');
    ok('skipping goes straight to the rest', !!q('.rest-stations') && txt('.run-head .run-stat') === 'Sala 6 de 12',
       txt('.run-head .run-stat'));
    ok("what's skipped doesn't count as cleared", states2() === '✔––––▶······', states2());
    ok('and you take what you had', maskCount() === hurtMasks, hurtMasks + ' → ' + maskCount());
    ok('hurt, the hot springs show the masks and the soul they would give', !!q('[data-act="restBath"] .rs-ico.is-mask')
       && !!q('[data-act="restBath"] .rs-ico.is-soul'), txt('[data-act="restBath"] .rs-fxs'));
    ok('and the bench the masks, but not the soul', !!q('[data-act="restSit"] .rs-ico.is-mask')
       && !q('[data-act="restSit"] .rs-ico.is-soul'), txt('[data-act="restSit"] .rs-fxs'));
    await click('[data-act="runJump"][data-value="11"]');
    ok('and straight to a fight: the finale', txt('.foes-head h3') === nameEs('oro-mato'), txt('.foes-head h3'));
    winRoom();
    await click('[data-act="runNext"]');
    ok("finishing by skipping isn't completing it", !!q('.run-end.is-won') && txt('.run-end .fight-end-note').indexOf('10 salas saltadas') >= 0,
       txt('.run-end .fight-end-note'));
    ok('and after the end there is no more skipping', !q('.timeline [data-act="runJump"]'));

    /* ── Bindings and room variations ───────────────────────────────────── */
    await click('[data-act="runQuit"]');
    await click('[data-act="bindToggle"][data-value="nail"]');
    await click('[data-act="runStart"]');
    ok('with the Nail Binding the hit goes from 32 to 20', txt('[data-act="hit"][data-id="nail"] .move-num') === '20',
       txt('[data-act="hit"][data-id="nail"] .move-num'));
    // In the room, the mini-bar is the scoreboard: this fight's masks, the same as the scene.
    ok("and Combat's mini-bar is the fight's scoreboard", visible() === 'fight' && q('#minihud').classList.contains('is-fight')
       && txt('#minihud .mini-me b') === txt('.kside-masks'), visible() + ' · ' + txt('#minihud .mini-me b') + ' / ' + txt('.kside-masks'));
    await click('[data-act="runQuit"]');
    await click('[data-act="bindToggle"][data-value="nail"]');
    await click('[data-act="bindToggle"][data-value="charms"]');
    await click('[data-act="runStart"]');
    await click('[data-act="runJump"][data-value="5"]');
    ok('with the Charms binding, not even at the bench', q('.rest-charms .quick').classList.contains('is-locked')
       && txt('.rest-charms .quick-hint').indexOf('vínculo de Amuletos') >= 0, txt('.rest-charms .quick-hint'));
    await click('.rest-charms .qc[data-id="longnail"]');
    ok('and the click explains it', equippedIds() === lockedIds && txt('#toast').indexOf('vínculo de Amuletos') >= 0, txt('#toast'));
    await click('[data-act="runQuit"]');
    await click('[data-act="bindToggle"][data-value="charms"]');
    await click('[data-act="pantheonPick"][data-value="hallownest"]');
    await click('[data-act="runStart"]');
    ok('Hallownest has 53 rooms', tiles().length === 53);
    ok('and its room 1 is TWO Vengefly Kings', d.querySelectorAll('.side-foes .foecard:not(.is-minion)').length === 2,
       d.querySelectorAll('.side-foes .foecard:not(.is-minion)').length + ' tarjetas');
    await click('[data-act="runQuit"]');
    await goto('fight');
  } catch (e) {
    errors.push('exception: ' + (e && e.message));
  }
  show();
});
window.addEventListener('error', (e) => errors.push('in the harness: ' + e.message));
setTimeout(show, 60000);
</script>
</body></html>

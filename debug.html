<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>debug</title>
<style>html,body{margin:0;background:#07090e}iframe{border:0;display:block}</style></head><body>
<script src="js/data.js"></script>
<script src="js/hall.js"></script>
<script src="js/journal.js"></script>
<script src="js/hunter.js"></script>
<script src="js/pantheons.js"></script>
<script>
/* Debug page for screenshots: sets the prefs in localStorage and opens the site inside an
   iframe of the requested width (below 500 px headless capture crops if --window-size is
   used directly).
   ?w=390&h=2200&top=2450&lang=en&detail=1&view=charms|inventory|fight&foe=false-knight&hash=%23v%3D1...
   The screen: &view=; &fight=1 or &tab= already mean Combat. It also goes in the iframe's hash,
   because a link with a build and no "view=" opens Charms.
   Hall of Gods: &tab=hall&statue=<id> picks the statue, &hdiff=at|asra|radiant fights at it,
   &marks=at|asra|radiant|all|mix seeds the won symbols (mix: a bit of everything) and
   &pick=1 taps the statue, which on mobile opens its plaque; &tablet=1 reads the entrance
   tablet in place of the grid (&tablettop=<px>, the same as &top, scrolls the page up after
   opening it to see further down the list). &read=<id> opens that page of the
   Hunter's Journal.
   Your scene mid-fight: &hits=3&take=2&focus=1&freeze=5000 (see below); &info=spell:dd,foe opens
   those arena explanations.
   Pantheons: &tab=pantheon opens the tab (&binds=all|nail,soul picks the bindings); &run=master&room=5&masks=3&lb=3&cocoon=3&over=dead
   seeds a half-done run (with a strong build) to capture the timeline and the rooms.
   Your game's Hunter's Journal: &journal=1 (or &view=journal) opens its screen (with an h of one
   screen, e.g. 900: its list and its page measure the window), &jread=<id> reads that entry, &jfilter=unseen|seen|done
   presses that list tab, &jseed=mix|seen|ready|mark|<n> seeds the game (mix: a bit of everything; seen:
   all encountered; ready: the 146 complete; mark: and the Hunter's Mark; <n>: n encountered), and
   &jmark=none|seen|done presses that state on the entry being read (the game's notice shows) and
   &jtop=<px> (the same as &top) scrolls the screen up to see further down. With &marks=radiant, the Idol on Radiant. */
const q = new URLSearchParams(location.search);
const w = Number(q.get('w') || 1280);
const h = Number(q.get('h') || 6000);
const offsetY = Number(q.get('top') || 0);   /* 'top' clashes with window.top */
const view = q.get('view') || (q.get('journal') === '1' ? 'journal' : q.get('fight') === '1' || q.get('tab') ? 'fight' : 'charms');
localStorage.setItem('hollow.prefs', JSON.stringify({
  lang: q.get('lang') || 'en', langChosen: true,
  compare: 'base', open: [], view,
  detailOpen: q.get('detail') === '1',
  foeId: q.get('foe') || '',
  hallId: q.get('statue') || 'gruz-mother',
  hallDiff: q.get('hdiff') || '',
  fightTab: q.get('tab') || 'combat',
  pgMapBig: q.get('mapbig') === '1',   /* &mapbig=1: the Map's large size */
  /* &mapwhole=1: the whole map drawn, whatever the save has visited; &mapfound=1: what you have too. */
  pgMapWhole: q.get('mapwhole') === '1',
  pgMapFound: q.get('mapfound') === '1',
  /* Progress: &pgshow=feats opens the achievements tab, &pgopen=<row> opens that row (f:<group> for an achievements one). */
  pgShow: q.get('pgshow') || 'pct',
  pgOpen: q.get('pgopen') || '',
  cocoon: Number(q.get('cocoon') || 0),
  /* &binds=all or &binds=nail,soul: the bindings chosen on the choose-a-pantheon screen. */
  bindings: Object.fromEntries(['nail', 'shell', 'charms', 'soul'].map((k) =>
    [k, q.get('binds') === 'all' || (q.get('binds') || '').split(',').includes(k)])),
}));
localStorage.removeItem('hollow.run');
localStorage.removeItem('hollow.hall');
localStorage.removeItem('hollow.journal');
localStorage.removeItem('hollow.owned');
/* The lifeblood door: &bdone=<n> marks the first n bindings (pantheon by pantheon, in the
   order nail, shell, charms, soul) and &ball=knight,sage the ones done with all four at once. */
localStorage.removeItem('hollow.bindings');
if (q.get('bdone') || q.get('ball')) {
  const P = HK.pantheons;
  let dr = P.normalizeDoor(null);
  const n = Number(q.get('bdone') || 0);
  for (let i = 0; i < n; i++) dr = P.toggleBind(dr, P.PANTHEONS[Math.floor(i / 4)].id, P.BINDS[i % 4]);
  for (const id of (q.get('ball') || '').split(',').filter(Boolean)) dr = P.toggleAll(dr, id);
  localStorage.setItem('hollow.bindings', JSON.stringify(dr));
}
/* Charms found: &owned=<n> marks the first n of the inventory (without it, the maximum). */
if (q.get('owned')) localStorage.setItem('hollow.owned', JSON.stringify(HK.data.CHARMS.slice(0, Number(q.get('owned'))).map((c) => c.id)));
/* &ownlist=a,b,c: the exact collection, with the slot states (fheart-broken, white-fragment…). */
if (q.get('ownlist')) localStorage.setItem('hollow.owned', JSON.stringify(q.get('ownlist').split(',')));
if (q.get('jseed')) {
  const H = HK.hunter, seed = q.get('jseed');
  let b = {};
  const req = H.BOOK.filter((r) => !r.optional && !r.start);
  if (seed === 'mix') H.BOOK.forEach((r, i) => {
    if (i % 4 === 1) b = H.encounter(b, r.id);
    if (i % 4 === 2) b = H.complete(b, r.id);
    if (i % 4 === 3) b = H.step(H.encounter(b, r.id), r.id, -3);
  });
  else if (seed === 'seen') for (const r of H.BOOK) b = H.encounter(b, r.id);
  else if (seed === 'ready' || seed === 'mark') { for (const r of req) b = H.complete(b, r.id); if (seed === 'mark') b = H.complete(b, H.MARK); }
  else for (const r of req.slice(0, Math.max(0, Number(seed) - 2))) b = H.encounter(b, r.id);
  localStorage.setItem('hollow.journal', JSON.stringify(b));
}
if (q.get('marks')) {
  const m = q.get('marks'), diffs = HK.hall.DIFFS;
  const mix = (i) => diffs.slice(0, i % 4);
  localStorage.setItem('hollow.hall', JSON.stringify(Object.fromEntries(HK.hall.STATUES.map((s, i) =>
    [s.id, m === 'all' ? diffs : m === 'mix' ? mix(i) : diffs.includes(m) ? [m] : []]))));
}
if (q.get('run')) {
  localStorage.setItem('hollow.run', JSON.stringify({
    pantheon: q.get('run'), room: Number(q.get('room') || 0), over: q.get('over') || null,
    bindings: { nail: q.get('bnail') === '1', shell: false, charms: false, soul: false },
    cocoon: Number(q.get('cocoon') || 0),
    build: { nail: 4, masks: 9, vessels: 3, notches: 11, spells: { vs: 2, dd: 2, hw: 2 },
             arts: { cyclone: true, dash: true, great: true }, charms: ['ustrength', 'quickslash'] },
    masks: Number(q.get('masks') || 9), lbCharm: 0, lbCocoon: Number(q.get('lb') || 0), soul: 99,
    rest: {}, log: [],
    // &cleared=0,1,2 says which ones are cleared; without it, all the ones before the current one.
    ...(q.get('cleared') !== null ? { cleared: q.get('cleared').split(',').filter(Boolean).map(Number) } : {}),
  }));
}
/* The save slots: &saves=1 fills slot 2 with a game halfway through (and leaves 1, 3 and 4
   empty); &slot=<n> makes that one the active slot (without it, free mode). Without &saves,
   only free mode. */
localStorage.removeItem('hollow.saves');
if (q.get('saves')) {
  const mid = { 'hollow.build': 'v=1&nail=2&masks=7&vessels=1&notches=6&spells=110&arts=100&charms=wayward,quickslash&dream=0&cloak=1&grimm=1',
    'hollow.owned': JSON.stringify(['wayward', 'quickslash', 'fury', 'steady', 'grubsong', 'thorns', 'baldur', 'catcher']),
    'hollow.journal': JSON.stringify({ crawlid: 0, vengefly: 0, 'tiktik': 0, 'husk-hornhead': 3, 'gruz-mother': 0 }) };
  const active = Number(q.get('slot') || 0);
  localStorage.setItem('hollow.saves', JSON.stringify({ active, slots: active === 2 ? {} : { 2: mid } }));
  if (active === 2) for (const [k, v] of Object.entries(mid)) localStorage.setItem(k, v);
}
/* &ls=<JSON { key: value }>: those localStorage keys, as they are: a real game's slot, made with
   js/savefile.js from a save file (with hollow.saves making it the active one), for captures of
   Your game. */
if (q.get('ls')) for (const [k, v] of Object.entries(JSON.parse(q.get('ls')))) localStorage.setItem(k, v);
/* &steam=all|none|<comma-separated keys>: your account's achievements as read from Steam's
   file (hollow.account, source steam), with one fixed unlock date; &acct=hand:<keys>: the
   account kept by hand instead. &steamview=1 (in the site's hash) opens the steps view. */
localStorage.removeItem('hollow.account');
const ALL_ACH = ['CHARMED', 'ENCHANTED', 'BLESSED', 'PROTECTED', 'MASKED', 'SOULFUL', 'WORLDSOUL', 'FK_DEFEAT', 'DREAM_FK', 'HORNET_1', 'HORNET_2', 'SOUL_MASTER_DEFEAT', 'DREAM_SOUL_MASTER_DEFEAT', 'BROKEN_VESSEL', 'DREAM_BROKEN_VESSEL', 'DUNG_DEFENDER', 'MANTIS_LORDS', 'COLLECTOR', 'ZOTE', 'NEGLECT', 'ATTUNEMENT', 'AWAKENING', 'ASCENSION', 'GRUBFRIEND', 'METAMORPHOSIS', 'NAILSMITH_KILL', 'NAILSMITH_SPARE', 'QUIRREL_EPILOGUE', 'MOURNER', 'TRAITOR_LORD', 'STAG_STATION_HALF', 'STAG_STATION_ALL', 'TEACHER', 'WATCHER', 'BEAST', 'MAP', 'COLOSSEUM_1', 'COLOSSEUM_2', 'COLOSSEUM_3', 'ENDING_A', 'ENDING_B', 'ENDING_C', 'VOID', 'SPEEDRUN_1', 'SPEEDRUN_2', 'COMPLETION', 'SPEED_COMPLETION', 'STEELSOUL', 'STEELSOUL_COMPLETION', 'HUNTER_1', 'HUNTER_2', 'MR_MUSHROOM', 'WHITE_DEFENDER', 'GREY_PRINCE', 'GRIMM', 'NIGHTMARE_GRIMM', 'BANISHMENT', 'PANTHEON1', 'PANTHEON2', 'PANTHEON3', 'PANTHEON4', 'ENDINGD', 'COMPLETIONGG'];
if (q.get('steam') && q.get('steam') !== 'none') {
  const keys = q.get('steam') === 'all' ? ALL_ACH : q.get('steam').split(',');
  const unlocked = Object.fromEntries(keys.map((k) => [k, 1760439344]));
  localStorage.setItem('hollow.account', JSON.stringify({ source: 'steam', unlocked, hand: null, account: '1', name: 'UserGameStats_1_367520.bin', stamp: null, read: 1759900000000 }));
} else if ((q.get('acct') || '').startsWith('hand:')) {
  const unlocked = Object.fromEntries(q.get('acct').slice(5).split(',').filter(Boolean).map((k) => [k, 0]));
  localStorage.setItem('hollow.account', JSON.stringify({ source: 'hand', unlocked }));
}
/* &walk=<scene>: the save before rested at that bench (hollow.prev), so that opening the Map
   plays the Knight's walk from it to the bench of hollow.progress (js/app-knight.js). */
if (q.get('walk')) localStorage.setItem('hollow.prev', JSON.stringify({ snap: { 'hollow.progress': JSON.stringify({ bench: q.get('walk') }) }, saved: null }));
const f = document.createElement('iframe');
/* &page=map/ or es/mapa/ opens one of the pages of tools/pages.js instead of the root. */
f.src = (q.get('page') || '') + 'index.html' + (q.get('hash') ? q.get('hash') + (view !== 'charms' ? '&view=' + view : '') : '');
f.style.width = w + 'px';
f.style.height = h + 'px';
/* Scrolling with scrollTo doesn't repaint in headless mode: the document is moved up with a
   negative margin, which does go into the reflow and therefore into the capture. */
f.addEventListener('load', () => {
  if (offsetY) f.contentDocument.documentElement.style.marginTop = -offsetY + 'px';
  /* &live=live|paused|lost draws the active save as following the game's file in that state
     (headless can't pick a file): for captures of Your game and the header. */
  if (q.get('live')) {
    const A = f.contentWindow.HK.app;
    A.liveInfo = () => ({ state: q.get('live'), name: 'user1.dat' });
    A.render();
  }
  // &read=<id> opens the Journal, if it isn't open, and reads that page (hovering: tapping it would pick it).
  if (q.get('read')) {
    const doc = f.contentDocument;
    if (!doc.querySelector('.journal')) { const b = doc.querySelector('[data-act="picker"]'); if (b) b.click(); }
    const row = doc.querySelector('.jr-row[data-id="' + q.get('read') + '"]');
    if (row) row.dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));
  }
  // &pick=1 taps the chosen statue: on mobile that's what opens its plaque.
  if (q.get('pick') === '1') {
    const ped = f.contentDocument.querySelector('.ped-btn.is-on');
    if (ped) ped.click();
    if (offsetY) f.contentDocument.documentElement.style.marginTop = -offsetY + 'px';
  }
  // &tablet=1 opens the Hall's tablet; since scrolling doesn't repaint, the page is moved up.
  if (q.get('tablet') === '1') {
    const b = f.contentDocument.querySelector('[data-act="tablet"]');
    if (b) b.click();
    f.contentWindow.scrollTo(0, 0);
    const y = Number(q.get('tablettop') || offsetY);
    if (y) f.contentDocument.documentElement.style.marginTop = -y + 'px';
  }
  // &journal=1 opens your game's Journal; &jread, &jfilter and &jtop, see above.
  if (view === 'journal') {
    const doc = f.contentDocument;
    if (doc.getElementById('hj').hidden) doc.querySelector('#nav-hj').click();
    if (q.get('jread')) { const r = doc.querySelector('.hj-row[data-id="' + q.get('jread') + '"]'); if (r) r.click(); }
    if (q.get('jfilter')) { const c = doc.querySelector('[data-act="hjShowState"][data-value="' + q.get('jfilter') + '"]'); if (c) c.click(); }
    if (q.get('jmark')) { const b = doc.querySelector('.hj-state [data-value="' + q.get('jmark') + '"]'); if (b) b.click(); }
    // &jbulk=1 opens "Mark in bulk"; &jpick=id,id picks those rows with their checkbox.
    if (q.get('jbulk')) { const b = doc.querySelector('[data-act="hjBulk"]'); if (b) b.click(); }
    for (const id of (q.get('jpick') || '').split(',').filter(Boolean)) { const c = doc.querySelector('.hj-pick[data-id="' + id + '"]'); if (c) c.click(); }
    if (q.get('jtop')) doc.documentElement.style.marginTop = -Number(q.get('jtop')) + 'px';
  }
  // ?open=<id> focuses that charm on the grid: its detail shows alongside, to see it in a screenshot.
  const open = q.get('open');
  if (open) {
    const tile = f.contentDocument.querySelector('#panel .quick-grid .qc[data-id="' + open + '"]');
    if (tile) tile.focus();
  }
  /* ?hover=<id> hovers that charm: the detail and the preview on the figures. Mouse only,
     so the capture needs --blink-settings=primaryHoverType=2,primaryPointerType=4,
     availableHoverTypes=2,availablePointerTypes=4 (see debug-hover.html). */
  const hover = q.get('hover');
  if (hover) {
    const tile = f.contentDocument.querySelector('#panel .quick-grid .qc[data-id="' + hover + '"]');
    if (tile) tile.dispatchEvent(new f.contentWindow.MouseEvent('mouseover', { bubbles: true }));
  }
  /* Your side of the arena mid-fight: ?hits=<n> hits n times with the nail, ?take=<n> lets
     the enemy hit you n times with its first attack (or ?focus=<n> you focus), and
     ?freeze=<ms> freezes the scene's animations at that instant: with 5000 all the ones from
     a single hit have finished and you can see how it ends up. It also freezes the enemy's stage
     (the hit's flash, the figure rising, the phase title, the dust). */
  const clickN = (sel, n) => {
    for (let i = 0; i < n; i++) { const b = f.contentDocument.querySelector(sel); if (b && !b.disabled) b.click(); }
  };
  clickN('[data-act="hit"][data-id="nail"]', Number(q.get('hits') || 0));
  clickN('.move-foe', Number(q.get('take') || 0));
  clickN('[data-act="hit"][data-id="focus"]', Number(q.get('focus') || 0));
  // ?info=spell:dd,foe opens those arena explanations: an attack's "?" or the enemy side's.
  for (const id of (q.get('info') || '').split(',').filter(Boolean)) clickN(`[data-act="help"][data-id="${id}"]`, 1);
  // ?click=restCocoon,restSit presses those buttons (by their data-act) in that order.
  for (const act of (q.get('click') || '').split(',').filter(Boolean)) clickN(`[data-act="${act}"]`, 1);
  /* The trailer's drop (tools/trailer-v2/): &imp=idle|drag|ready opens the import into slot 1,
     and drags a file over it (the zone lit, "Let go") or drops it, &impfile=<path from here>
     being the save it reads (a synthetic DataTransfer: what a real drop hands the page). */
  if (q.get('imp')) {
    // Headless doesn't tick an idle page's animations: the screen's entrance would stay half-faded.
    const st = f.contentDocument.createElement('style');
    st.textContent = '*, *::before, *::after { animation: none !important; transition: none !important; }';
    f.contentDocument.head.appendChild(st);
  }
  if (q.get('imp') === 'idle') {
    f.contentWindow.HK.app.importFirstEmpty();
    // Where the zone is (it moves with each language's text), in a pre#zone for --dump-dom.
    const r = f.contentDocument.querySelector('.imp-drop').getBoundingClientRect();
    const pre = document.createElement('pre'); pre.id = 'zone';
    pre.textContent = JSON.stringify({ x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height });
    document.body.appendChild(pre);
  } else if (q.get('imp')) {
    const W = f.contentWindow, A = W.HK.app;
    A.importFirstEmpty();
    const x = new XMLHttpRequest();
    x.open('GET', q.get('impfile'), false);
    x.overrideMimeType('text/plain; charset=x-user-defined');
    x.send();
    const bytes = Uint8Array.from(x.responseText, (c) => c.charCodeAt(0) & 0xff);
    const dt = new W.DataTransfer();
    dt.items.add(new W.File([bytes], 'user1.dat', { lastModified: Date.parse('2026-09-20T21:14:00Z') }));
    // A synthetic item has no file handle to give: without the method, the site reads the File itself.
    delete W.DataTransferItem.prototype.getAsFileSystemHandle;
    // Once the screen has settled (a later repaint would drop the lit zone).
    setTimeout(() => {
      const zone = f.contentDocument.querySelector('.imp-drop');
      zone.dispatchEvent(new W.DragEvent('dragenter', { bubbles: true, cancelable: true, dataTransfer: dt }));
      if (q.get('imp') === 'ready') zone.dispatchEvent(new W.DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
    }, 400);
  }
  /* The trailer's map (tools/trailer-v2/): &pins=all draws what you have as if missing (the
     trailer's "before"), &pins=missing hides it in place (the same layout, so the two captures
     line up pin for pin), and both write every pin's box and whether you have it into
     a pre#pins for --dump-dom. */
  if (q.get('pins')) {
    const d = f.contentDocument;
    // Something you can have: not a place (bench:3, people:iselda) nor a stag station (is-on there means closed).
    const counts = (id) => !/^people:|^[a-z-]+:\d+$|^stag-/.test(id);
    const pins = () => [...d.querySelectorAll('.pgm-pin[data-id]')].map((g) => ({ g, id: g.dataset.id, n: counts(g.dataset.id), on: g.classList.contains('is-on') && counts(g.dataset.id) }));
    for (const p of pins()) if (p.on) p.g.style[q.get('pins') === 'all' ? 'opacity' : 'visibility'] = q.get('pins') === 'all' ? '1' : 'hidden';
    setTimeout(() => {
      const out = pins().map(({ g, id, n, on }) => {
        const r = (g.querySelector('circle') || g).getBoundingClientRect();   // yours (shade, markers) have no disc
        return { id, n, on, x: +(r.left + r.width / 2).toFixed(1), y: +(r.top + r.height / 2).toFixed(1), r: +(r.width / 2).toFixed(1) };
      });
      const pre = document.createElement('pre'); pre.id = 'pins'; pre.textContent = JSON.stringify(out);
      document.body.appendChild(pre);
    }, 500);
  }
  /* &way=1, with &view=map and &walk=<scene>: draws the way the Knight takes from that bench to
     the save's (js/walk.js, by kind: a walk in white, a stag ride in gold, a tram in cyan, a lift
     in magenta), fits the map to it and keeps it so while he walks; and after &wayat=<ms> writes
     where his pin is into a pre#way (for --dump-dom with --virtual-time-budget). */
  if (q.get('way') === '1' && q.get('walk')) {
    const W = f.contentWindow, A = W.HK.app, d = f.contentDocument;
    const legs = A.knight.way(q.get('walk'), A.progress.bench);
    const svg = d.querySelector('.pgm-svg');
    if (legs && svg) {
      const COL = { walk: '#fff', stag: '#ffdc00', tram: '#00dcff', lift: '#ff00ff' };
      const g = d.createElementNS('http://www.w3.org/2000/svg', 'g'); g.id = 'dbg-way';
      g.innerHTML = legs.map((l) => `<polyline points="${l.pts.map(([x, y]) => `${x},${-y}`).join(' ')}" fill="none" stroke="${COL[l.kind]}" stroke-width="0.06" stroke-dasharray="${l.kind === 'walk' ? '' : '0.1 0.1'}"/>`).join('');
      svg.appendChild(g);
      const pts = legs.flatMap((l) => l.pts), pad = 0.8;
      const x0 = Math.min(...pts.map((p) => p[0])) - pad, x1 = Math.max(...pts.map((p) => p[0])) + pad;
      const y0 = Math.min(...pts.map((p) => -p[1])) - pad, y1 = Math.max(...pts.map((p) => -p[1])) + pad;
      const fit = () => {
        const s = d.querySelector('.pgm-svg'), r = s && s.getBoundingClientRect();
        if (!r || !r.width) return;
        let w = x1 - x0, h = y1 - y0;
        if (w / h < r.width / r.height) w = h * (r.width / r.height); else h = w * (r.height / r.width);
        s.setAttribute('viewBox', `${(x0 + x1) / 2 - w / 2} ${(y0 + y1) / 2 - h / 2} ${w} ${h}`);
        if (!s.querySelector('#dbg-way')) s.appendChild(g);
        W.requestAnimationFrame(fit);
      };
      fit();
    }
    const pre = document.createElement('pre'); pre.id = 'way'; document.body.appendChild(pre);
    // His track, a sample every 250 ms: the time, his pin's point, its opacity, his frame and his facing.
    const track = [];
    const sample = () => { const pin = d.querySelector('.pgm-you'); track.push([Math.round(W.performance.now()), pin && pin.style.getPropertyValue('--px'), pin && pin.style.getPropertyValue('--py'), pin && pin.style.opacity, pin && pin.querySelector('svg').getAttribute('viewBox').split(' ')[0], pin && pin.querySelector('.pgm-you-art').getAttribute('transform') ? 'L' : 'R']); };
    const iv = setInterval(sample, 250);
    setTimeout(() => {
      clearInterval(iv); sample();
      pre.textContent = JSON.stringify({ legs: legs && legs.map((l) => [l.kind, l.pts.length]), walking: !!A.knight.state().walking, track });
    }, Number(q.get('wayat') || 1500));
  }
  // The Knight (js/app-knight.js) fades in with a CSS transition, which headless Chrome doesn't
  // tick once the page is idle: he'd be captured half seen. Cut, he's always whole.
  { const st = f.contentDocument.createElement('style'); st.textContent = '.kn { transition: none !important; }'; f.contentDocument.head.appendChild(st); }
  if (q.get('freeze') !== null) {
    const st = f.contentDocument.createElement('style');
    st.textContent = `.kscene, .kscene *, .kscene::before, .kscene::after, .fstage, .fstage *, #panel .hud * { animation-delay: -${Number(q.get('freeze'))}ms !important; animation-play-state: paused !important; }`;
    f.contentDocument.head.appendChild(st);
  }
  // ?fx=<ms> freezes the overcharm flash at that instant of the animation; with &fxgold=1,
  // the one for all four bindings at once (in gold, with &tab=pantheon&binds=all).
  const fx = q.get('fx');
  if (fx !== null) {
    const d = f.contentDocument;
    const layer = d.getElementById('overcharm-fx');
    const gold = q.get('fxgold') === '1';
    d.documentElement.classList.add(gold ? 'is-binding-all' : 'is-overcharming');
    layer.classList.toggle('is-gold', gold);
    d.querySelector('.page').classList.add('is-quaking');
    layer.hidden = false;
    layer.classList.add('is-on');
    for (const node of [layer, d.querySelector('.page')]) {
      node.style.animationPlayState = 'paused';
      node.style.animationDelay = '-' + Number(fx) + 'ms';
    }
  }
});
document.body.appendChild(f);
</script>
</body></html>

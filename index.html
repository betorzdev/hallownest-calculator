<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hallownest Calculator</title>
<meta name="description" content="How the Knight's stats in Hollow Knight change with every charm and every upgrade.">
<meta name="theme-color" content="#07090e">
<link rel="icon" href="assets/charms/voidheart.png">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="page">
  <div class="shell">
    <header class="masthead" id="masthead"></header>
    <nav class="nav" id="nav" aria-label="Screens">
      <div class="nav-tabs">
        <a class="nav-tab" data-act="view" data-value="charms" href="#">Charms</a>
        <a class="nav-tab" data-act="view" data-value="game" href="#view=game">Your game</a>
        <a class="nav-tab" data-act="view" data-value="fight" href="#view=fight">Combat</a>
        <a class="nav-tab nav-hj" id="nav-hj" data-act="view" data-value="journal" href="#view=journal"><span class="nav-lbl">Journal</span><span class="nav-num"></span></a>
      </div>
      <div class="minihud" id="minihud" aria-hidden="true"></div>
    </nav>
    <main class="screens">
      <div id="banner"></div>
      <div id="guide"></div>
      <section class="panel" id="panel" aria-label="Charms"></section>
      <section class="gear" id="gear" aria-label="Your game" hidden></section>
      <section class="gear fight" id="fight" aria-label="Combat" hidden></section>
      <section class="hj-sec" id="hj" aria-label="Journal" hidden></section>
    </main>
    <footer class="colophon" id="colophon"></footer>
  </div>
</div>
<div class="overcharm-fx" id="overcharm-fx" hidden aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/enemies.js"></script>
<script src="js/journal.js"></script>
<script src="js/pantheons.js"></script>
<script src="js/hall.js"></script>
<script src="js/hunter.js"></script>
<script src="js/engine.js"></script>
<script src="js/fight.js"></script>
<script src="js/codec.js"></script>
<script src="js/app.js"></script>
</body>
</html>
